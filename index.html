/* 名称归一：文件里常写「应交城市维护建设税」「本期进项税额」，去掉前缀再查一次 */
function labelId(label){
  if(LABELS[label]) return LABELS[label];
  const t = label.replace(/^应交税费[-—·]?/,"").replace(/^(应交|应缴|本期|本月|当月|当期)+/,"");
  return LABELS[t] || "";
}
/* 名称对行：先精确，再按 id，最后做一次「包含」模糊匹配（租金收入 ↔ 租金） */
function findRowByLabel(label, f){
  let row = S.rows.find(x=>x.name === label);
  if(row) return row;
  if(f){ row = S.rows.find(x=>x.id === f); if(row) return row; }
  if(isExempt(label)) return null;      // 出口免税这类不参与模糊匹配，免得并进普通货物收入
  const cands = S.rows.filter(x=>{
    if(x.kind !== "income" && x.kind !== "vatRate" && x.kind !== "input") return false;
    if(x.name.length < 2) return false;
    return label.includes(x.name) || x.name.includes(label);
  });
  return cands.length === 1 ? cands[0] : null;
}
/* 这些行是计算结果或标题，导入时不能当成自定义税种 */
const SKIP_LABELS = new Set([
  "项目","月份","合计","全年合计","总额",
  "收入合计","营业收入合计","主营业务收入合计","销售收入合计","税金合计","全部税金","累计税金",
  "税金及附加","税金及附加合计","主营业务税金及附加","应交税费合计",
  "毛利","毛利率","收入","营业收入",
  "增值税","增值税应纳","应纳增值税","增值税计税基数","其他税种","其他税金",
  "本月增值税税负率","本年增值税税负率","本月综合税负率","本年综合税负率","税负率",
  "其他税费","附加税合计","小计","累计","备注","说明",
  "进项税额转出"
]);
/* 计算结果行的通用形态：本期应交增值税 / 应交增值税 / 税金及附加合计…
   只认「增值税」「税金及附加」这类汇总词，免得把「应交房产税」这种真实税种误杀 */
const CALC_LABEL_RE = /^(本期|本月|本年|当月|当期)?(应交|应纳|应缴)?(增值税|税金及附加|税费|税额)(合计|小计)?$/;
/* 新行默认税率：名字里带「服务」按 6%，带货物/销售/商品按 13%，其余先给 0（点百分比可改） */
function guessIncomeRate(name){
  if(/租金|租赁/.test(name)) return 9;
  if(/外销|出口/.test(name)) return 0;              // 出口免税，销项不在收入行上算
  if(/服务|劳务/.test(name)) return /服务/.test(name) ? 6 : 0;
  if(/货物|销售|商品|产品/.test(name)) return 13;
  return 0;
}
/* 免税类项目：出口免税 / 免税收入 / 不征税收入 —— 是收入，不是税费，销项税按 0 计 */
const isExempt = name => /免税|不征税|出口/.test(name);
/* 分节标题（一、基础经营数据 / 二、增值税计算明细…）不是项目行 */
const SECTION_RE = /^[一二三四五六七八九十]+[、.．]/;
function sectionOf(text){
  if(/经营|收入|业务数据/.test(text)) return "income";
  if(/增值税/.test(text)) return "vat";
  return "fee";
}
/* 从标题里认公司名：「粤书亚 · 2026 年度税金台账」「金哪达贸易_税金台账_2026」→ 粤书亚 / 金哪达贸易 */
function guessCompanyFrom(text){
  let t = String(text || "").replace(/\s/g,"");
  if(!t) return "";
  t = t.replace(/[·・|｜\-—_]?(?:19|20)\d{2}年?度?[\s\S]*$/,"");               // 砍掉年份及之后
  t = t.replace(/[·・|｜\-—_]*(?:税金台账|台账|税负率与利润分析|税负率|利润分析|分析)[\s\S]*$/,"");
  t = t.replace(/^[·・|｜\-—_]+|[·・|｜\-—_]+$/g,"");
  /* 剩下这点东西得像个公司名：不能带数字，也不能还残留「台账 / 月度 / 合计」这类字样 */
  if(t.length < 2 || t.length > 30) return "";
  if(/\d/.test(t) || /月|表|台账|税负|利润|合计|分析|年度/.test(t)) return "";
  return t;
}
/* 从标题 / 文件名里认年月：
   「粤书亚 · 2026 年度税金台账」→ 2026；「2026年10月」/「10月税金表」→ 10；
   「2026年度（1–10月）」→ 年份 2026、当前月 10 */
function parsePeriod(text){
  const t = String(text || "").replace(/\s/g,"");
  const out = {year:0, month:0, from:0};
  const y = t.match(/(?:19|20)\d{2}/);
  if(y) out.year = +y[0];
  /* 区间写法 1-10月 / 1至10月 / 1～10月：结束月当「当前月」 */
  const rng = t.match(/(\d{1,2})\s*[-~—–至到]\s*(\d{1,2})月/);
  if(rng){
    const a = +rng[1], b = +rng[2];
    if(a >= 1 && a <= 12 && b >= a && b <= 12){ out.from = a; out.month = b; }
  }
  if(!out.month){
    const ms = (t.match(/(\d{1,2})月/g) || [])
      .map(s=>+s.replace("月","")).filter(n=>n >= 1 && n <= 12);
    if(ms.length){ out.from = Math.min(...ms); out.month = Math.max(...ms); }
  }
  /* 2026-10 / 2026.10 / 2026/10 这种写法 */
  if(!out.month){
    const m2 = t.match(/(?:19|20)\d{2}\s*[年.\-_/]\s*(\d{1,2})(?!\d)/);
    if(m2){ const n = +m2[1]; if(n >= 1 && n <= 12) out.month = n; }
  }
  return out;
}
function applyMatrix(matrix, fileName){
  let headerIdx = -1, monthCols = {};
  for(let i=0;i<Math.min(matrix.length, 12);i++){
    const row = matrix[i] || [];
    const found = {};
    row.forEach((cell, ci)=>{
      const m = String(cell).replace(/\s/g,"").match(/^(\d{1,2})月$/);
      if(m){ const n = +m[1]; if(n>=1 && n<=12) found[n] = ci; }
    });
    if(Object.keys(found).length >= 3){ headerIdx = i; monthCols = found; break; }
  }
  if(headerIdx < 0) throw new Error("没找到「1月…12月」表头，无法识别格式");

  /* 表头之上那几行标题：公司名、年份、月份都从这里取，取不到再退回文件名 */
  const titleTexts = [];
  for(let i=0;i<headerIdx;i++){
    const cells = (matrix[i] || []).map(c=>String(c ?? "").trim()).filter(Boolean);
    if(cells.length) titleTexts.push(cells.join(" "));
  }
  const stem = String(fileName || "").replace(/\.[^.]+$/,"");

  let company = "";
  for(const tx of titleTexts){
    if(!/台账|税负率|利润分析|年度/.test(tx)) continue;
    company = guessCompanyFrom(tx);
    if(company) break;
  }
  if(!company && fileName && /台账|税负率|分析/.test(fileName)){
    company = guessCompanyFrom(stem);
  }
  const companyNew = (company && company !== S.company) ? company : "";
  if(companyNew) S.company = companyNew;

  /* 年份 / 月份：标题优先，文件名兜底。年份只认 2000–2100，避免把合计数年份化 */
  const tP = titleTexts.map(parsePeriod).filter(p=>p.year || p.month)[0] || {};
  const fP = parsePeriod(stem);
  const yearGot = tP.year || fP.year || 0;
  const monthGot = (tP.month || fP.month || 0);
  const yearNew = (yearGot >= 2000 && yearGot <= 2100 && yearGot !== S.year) ? yearGot : 0;
  if(yearNew) S.year = yearNew;

  /* 第一遍：按首列名称收数。名称就是「行的身份」，跟列位置无关。
     同时记下每一项出现在哪个分节（基础经营数据 / 增值税 / 附加税及其他），
     空行也收进来 —— 表里有这一项，台账里就该有这一行，方便以后补数。 */
  const picked = {}, rates = {}, secOf = {}, skipped = [];
  let section = "";
  for(let i=headerIdx+1;i<matrix.length;i++){
    const row = matrix[i] || [];
    const raw = String(row[0]||"").replace(/\s/g,"");
    if(!raw) continue;
    if(SECTION_RE.test(raw) || /基础经营数据|增值税计算明细|附加税及其他税种明细|税负分析/.test(raw)){
      section = sectionOf(raw);
      continue;
    }
    const rm = raw.match(/(\d+(?:\.\d+)?)%$/);          // 名字末尾带税率的（劳务收入 6%）
    const label = raw.replace(/[（(].*?[)）]/g,"").replace(/\d+(?:\.\d+)?%$/,"");
    if(!label) continue;
    if(!(labelId(label) === "vat") &&
       (SKIP_LABELS.has(label) || CALC_LABEL_RE.test(label) ||
        /^(备注|说明|注[:：]|合计|小计|总计|累计)/.test(label))){
      /* 进项税额转出 / 应交增值税这类是计算口径，不是独立税种，跳过但记下来提示 */
      if(/进项税额转出|^(本期|本月|本年|当月|当期)?(应交|应纳|应缴)(增值税|税费|税额)/.test(label)) skipped.push(label);
      continue;
    }
    if(rm) rates[label] = +rm[1];
    const vals = {};
    for(const [mn, ci] of Object.entries(monthCols)){
      const cell = String(row[ci] ?? "").replace(/,/g,"").replace(/\s/g,"").trim();
      const neg = /^\(.*\)$/.test(cell);            // 会计表的负数写法 (1,234.00)
      const clean = neg ? cell.slice(1,-1) : cell;
      if(clean !== "" && clean !== "-" && clean !== "—"){
        const v = parseFloat(clean);
        if(isFinite(v)) vals[+mn-1] = neg ? -Math.abs(v) : v;
      }
    }
    /* 同名项目在两处出现（出口免税既在收入区又在税费区）时，以先出现的为准，
       但只要有任何一个出现在「基础经营数据」区，就认定它是收入项 */
    if(!(label in picked)) secOf[label] = section;
    if(section === "income") secOf[label] = "income";
    if(!(label in picked) || Object.keys(vals).length) picked[label] = vals;
  }
  if(!Object.keys(picked).length) throw new Error("没识别到任何税种行（货物收入/销项税/进项税…）");

  /* 第二遍：名称对到行。表里有、本地没有的行自动建出来，不丢数 */
  const map = {}, created = [], converted = [];
  Object.keys(picked).forEach(label=>{
    const f = labelId(label);
    if(f === "carryOut"){ return; }        // 期末留抵是算出来的，导入时丢掉
    if(f === "output" || f === "vat" || f === "inputTax" || f === "cost" ||
       f === "preVat" || f === "preCity" || f === "carryIn"){ map[label] = f; return; }
    /* 这一项该是什么类型：免税类 → 收入项（税率 0）；收入区 → 收入项；
       税费区 → 手工税费；没有分节信息时按名字判断 */
    const sec = secOf[label] || "";
    const wantFee = !isExempt(label) &&
      (sec === "fee" || sec === "vat" || (!sec && /税|金|费|附加|基金/.test(label)));
    const rate = rates[label] !== undefined ? rates[label]
               : (isExempt(label) ? 0 : guessIncomeRate(label));

    let row = findRowByLabel(label, f);
    if(!row){
      const d = DEF_ROWS.find(x=>x.name === label) || (f ? DEF_ROWS.find(x=>x.id === f) : null);
      if(d){
        row = Object.assign({}, d);
        S.rows.push(row); created.push(row.name);
      }else if(label.length <= 20 && /[\u4e00-\u9fa5A-Za-z]/.test(label)){
        row = wantFee ? {id:newRowId(), kind:"input",  name:label}
                      : {id:newRowId(), kind:"income", name:label, rate};
        S.rows.push(row); created.push(row.name);
      }
    }else if(!wantFee && row.kind !== "income"){
      /* 台账里已经有一行同名的手工税费（例如以前导入时把「出口免税」当成税费建过），
         而它其实是收入项 → 就地改成收入项，金额从「税金合计」挪到「收入合计」 */
      S.months.forEach(m=>{
        if(!has(m[OV(row.id)])) return;
        if(!has(m[row.id])) m[row.id] = m[OV(row.id)];
        delete m[OV(row.id)];
      });
      row.kind = "income";
      row.rate = rates[label] !== undefined ? rates[label] : (isExempt(label) ? 0 : (row.rate || 0));
      delete row.half;
      converted.push(row.name);
    }
    if(row) map[label] = row.id;
  });

  /* 第三遍：写数。双态行先落在「手动值」上，下一遍再跟自动值比对 */
  const fresh = Array.from({length:N}, blank);
  Object.keys(picked).forEach(label=>{
    const key = map[label];
    if(!key) return;
    const vals = picked[label];
    const row = key === "output" ? null : S.rows.find(x=>x.id === key);
    const dual = key === "output" || key === "vat" || key === "preCity" || key === "carryIn" ||
                 (row && row.kind === "vatRate");
    for(let i=0;i<N;i++){
      if(vals[i] === undefined) continue;
      if(dual) fresh[i][OV(key)] = String(vals[i]);
      else     fresh[i][key] = String(vals[i]);
    }
  });

  /* 第四遍：识别手改值。与自动值差 ≤ 0.005 视为自动算出来的，不标手改 */
  let manCount = 0;
  for(let i=0;i<N;i++){
    const m = fresh[i];
    if(!has(m[OV("output")])) continue;
    const auto = calcMonth(m).auto.output;
    if(Math.abs(num(m[OV("output")]) - auto) <= 0.005) delete m[OV("output")];
    else manCount++;
  }
  /* 增值税：文件里的数与「销项−进项−预缴−留抵」自动值一致（留抵月取 0）就不算手改 */
  let vcarry = 0;
  for(let i=0;i<N;i++){
    const m = fresh[i];
    const ci = has(m[OV("carryIn")]) ? r2(num(m[OV("carryIn")])) : (i === 0 ? 0 : vcarry);
    normalizeVat(m, ci);
    if(has(m[OV("vat")])) manCount++;
    vcarry = calcMonth(m, ci).carryOut;
  }
  for(let i=0;i<N;i++){
    const m = fresh[i], c = calcMonth(m);
    S.rows.filter(r=>r.kind === "vatRate").forEach(r=>{
      if(!has(m[OV(r.id)])) return;
      if(Math.abs(num(m[OV(r.id)]) - num(c.auto[r.id])) <= 0.005) delete m[OV(r.id)];
      else manCount++;
    });
    /* 预缴房产城建税：文件填的数与「预缴增值税×城建税率」一致就不算手改 */
    if(has(m[OV("preCity")])){
      if(Math.abs(num(m[OV("preCity")]) - c.preCityAuto) <= 0.005) delete m[OV("preCity")];
      else manCount++;
    }
  }

  /* 期初留抵：文件里的数与「上月期末留抵」一致就转成自动结转（1 月的 0 也回归自动） */
  let prevCarry = 0;
  for(let i=0;i<N;i++){
    const m = fresh[i];
    const expect = (i === 0 ? 0 : prevCarry);         // 自动结转值
    if(has(m[OV("carryIn")]) &&
       Math.abs(num(m[OV("carryIn")]) - expect) <= 0.005) delete m[OV("carryIn")];
    const ci = has(m[OV("carryIn")]) ? num(m[OV("carryIn")]) : expect;
    prevCarry = calcMonth(m, ci).carryOut;
  }

  /* 全 0 且无手改值的月份还原成空白月（旧表把空月写成 0.00） */
  for(let i=0;i<N;i++){
    const m = fresh[i];
    const allZero = (!has(m.inputTax) || num(m.inputTax) === 0)
      && (!has(m.cost) || num(m.cost) === 0)
      && (!has(m.preVat) || num(m.preVat) === 0)
      && (!has(m[OV("preCity")]) || num(m[OV("preCity")]) === 0)
      && (!has(m[OV("vat")]) || num(m[OV("vat")]) === 0)
      && (!has(m[OV("carryIn")]) || num(m[OV("carryIn")]) === 0) && S.rows.every(r=>{
      if(r.kind === "vatRate") return !has(m[OV(r.id)]);
      if(r.kind === "income" || r.kind === "input") return !has(m[r.id]) || num(m[r.id]) === 0;
      return true;
    });
    if(allZero) fresh[i] = blank();
  }
  S.months = fresh;
  foldPrepaidRows();      // 老台账里的预缴手工行并进固定行，避免重复计入合计
  migratePreCity();       // 老口径的「预缴房产城建税」手填值 → 双态行的手改值

  /* 视图跟着文件走：文件写了月份就跳到那个月；没写就跳到最后一个有金额的月 */
  let monthIdx = -1;
  if(monthGot >= 1 && monthGot <= N) monthIdx = monthGot - 1;
  else{
    let lastAny = -1;
    for(let i=0;i<N;i++){
      const m = fresh[i];
      if(isBlank(m)) continue;
      lastAny = i;
      if(Object.keys(m).some(k=>Math.abs(num(m[k])) > 0.004)) monthIdx = i;
    }
    if(monthIdx < 0) monthIdx = lastAny;
  }
  if(monthIdx >= 0){ sel = monthIdx; collapse = false; }

  buildGrid(); syncControls(); paint(); save();
  return {manCount, newTax: created.length, created, converted, skipped, company: companyNew,
          year: yearNew, month: monthIdx >= 0 ? monthIdx + 1 : 0, monthFromFile: !!monthGot};
}
function impMsg(r){
  const p = [];
  if(r && r.company) p.push("公司名取用「" + r.company + "」");
  if(r && r.year) p.push("年度切到 " + r.year);
  if(r && r.month) p.push(r.monthFromFile ? "定位到 " + r.month + " 月"
                                          : "定位到有数据的 " + r.month + " 月");
  if(r && r.manCount) p.push(r.manCount + " 处手改值");
  if(r && r.newTax){
    const names = (r.created || []).slice(0,3).join("、") + ((r.created || []).length > 3 ? " 等" : "");
    p.push("新增 " + r.newTax + " 行（" + names + "）");
  }
  if(r && r.converted && r.converted.length){
    const names = r.converted.slice(0,3).join("、") + (r.converted.length > 3 ? " 等" : "");
    p.push("「" + names + "」按收入项处理（税率 0）");
  }
  if(r && r.skipped && r.skipped.length){
    p.push("跳过计算行 " + r.skipped.slice(0,2).join("、") + (r.skipped.length > 2 ? " 等" : "") +
           "（不重复计入）");
  }
  return p.length ? "，" + p.join("，") : "";
}
/* 把 csv / xlsx / html 表格统一读成二维数组 */
async function readMatrix(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".csv")){
    const text = await file.text();
    return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(","));
  }
  if(name.endsWith(".xlsx") || name.endsWith(".xlsm")){
    const files = await unzip(await file.arrayBuffer());
    const sheetKey = Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
    if(!sheetKey) throw new Error("xlsx 里找不到工作表");
    const dec = new TextDecoder();
    const shared = files["xl/sharedStrings.xml"] ? parseShared(dec.decode(files["xl/sharedStrings.xml"])) : [];
    return sheetToMatrix(dec.decode(files[sheetKey]), shared);
  }
  // .xls / .htm —— 多数是 HTML 表格
  const text = await file.text();
  if(/<table/i.test(text)) return htmlTableToMatrix(text);
  throw new Error("这个 .xls 不是网页表格格式，请先用 Excel 另存为 .xlsx 再导入");
}
async function importExcel(file){
  try{
    const matrix = await readMatrix(file);
    const r = applyMatrix(matrix, file.name);
    toast("已导入 " + file.name + impMsg(r));
  }catch(err){
    alert("导入失败：" + err.message);
  }
}

/* ================= 科目余额表导入 =================
   「导入余额表」读金蝶/用友导出的科目余额表，按映射表把「本期发生额」写进文件标注的那个月份，
   其它 11 个月一格都不碰。映射默认用 DEF_MAP，也可以直接选「映射表.xlsx」替换。
   布局识别全按表头文字走（科目编码 / 科目名称 / 期初余额 / 本期发生额 / 本年累计发生额 / 期末余额
   × 借方 / 贷方），不依赖固定列号，所以带不带辅助核算、有没有合并表头都能对上。 */
const keyOf = s => String(s == null ? "" : s).replace(/[\s\u3000]/g, "");
/* 会计数字：千分位、￥、括号负数 → 数字；空格 / - / — 一律当「没数」，跟 0 区分开 */
function cellNum(v){
  let t = keyOf(v).replace(/[,，￥¥]/g, "");
  if(t === "" || t === "-" || t === "—" || t === "–" || t === "/" || t === "——") return null;
  const neg = /^\(.*\)$/.test(t) || /^[-−]/.test(t);
  t = t.replace(/^\((.*)\)$/, "$1").replace(/^[-−]/, "");
  const n = parseFloat(t);
  if(!isFinite(n)) return null;
  return neg ? -n : n;
}
/* 期间：先看表头「2026年10月」，再退回文件名「…_2026-10_…」 */
function balPeriod(matrix, fileName){
  const texts = [];
  for(let i=0;i<Math.min(matrix.length, 8);i++){
    (matrix[i]||[]).forEach(c=>{ const t = String(c==null?"":c).trim(); if(t) texts.push(t); });
  }
  texts.push(String(fileName || ""));
  for(const tx of texts){
    const s = keyOf(tx);
    let m = s.match(/((?:19|20)\d{2})年(\d{1,2})月/);
    if(!m) m = s.match(/((?:19|20)\d{2})[-_./年](\d{1,2})(?!\d)/);
    if(m){
      const y = +m[1], mo = +m[2];
      if(y >= 2000 && y <= 2100 && mo >= 1 && mo <= 12) return {year:y, month:mo, from:tx};
    }
  }
  return {year:0, month:0, from:""};
}
function balCompany(matrix, fileName){
  for(let i=0;i<Math.min(matrix.length, 8);i++){
    for(const c of (matrix[i]||[])){
      const s = String(c==null?"":c).trim();
      const m = s.match(/核算单位[:：]\s*(.+)$/);
      if(m) return m[1].replace(/\s+/g,"").slice(0,30);
    }
  }
  const stem = String(fileName || "").replace(/\.[^.]+$/, "");
  const m = stem.match(/科目余额表[_-]([^_-]+)/);
  return m ? m[1].trim().slice(0,30) : "";
}
/* 表头解析：返回每一列所属分组（期初余额 / 本期发生额 / 本年累计发生额 / 期末余额）和借/贷 */
function balCols(matrix){
  let h = -1;
  for(let i=0;i<Math.min(matrix.length, 25);i++){
    const row = (matrix[i]||[]).map(keyOf);
    if(row.some(c=>/科目编码|科目代码|科目编号/.test(c)) && row.some(c=>/科目名称/.test(c))){ h = i; break; }
  }
  if(h < 0) return null;
  const head = (matrix[h]||[]).map(keyOf);
  const sub  = (matrix[h+1]||[]).map(keyOf);
  /* 两层表头：分组名一行 + 借/贷一行；一层表头：写成「本期发生额借方」 */
  const two  = sub.some(c=>/^借方?$/.test(c)) && sub.some(c=>/^贷方?$/.test(c));
  const cols = Math.max(head.length, sub.length);
  const grp = []; let cur = "";
  for(let c=0;c<cols;c++){ if(head[c]) cur = head[c]; grp[c] = cur; }
  const info = [];
  for(let c=0;c<cols;c++){
    let side = "";
    if(two){
      const s = sub[c] || "";
      if(/^借方?$/.test(s)) side = "D";
      else if(/^贷方?$/.test(s)) side = "C";
    }else{
      const g = head[c] || "";
      if(/借方/.test(g)) side = "D";
      else if(/贷方/.test(g)) side = "C";
    }
    const group = keyOf(grp[c] || "").replace(/借方|贷方/g,"").replace(/[（(].*?[)）]/g,"");
    info.push({c, group, side});
  }
  return {h, cols, two, info, dataStart: two ? h+2 : h+1};
}
/* 「本期发生额·贷方」→ 列号。组名按语义挑，避免「本年累计发生额」被「发生额」误命中 */
const BAL_GROUP_TESTS = [
  {k:/本年|累计/,  t:g=>/本年|累计/.test(g)},
  {k:/本期|本月|当月|当期|发生额/, t:g=>(/本期|本月|当月|当期|发生额/.test(g)) && !/本年|累计/.test(g)},
  {k:/期初/, t:g=>/期初/.test(g)},
  {k:/期末/, t:g=>/期末/.test(g)}
];
function balPickCol(cols, spec){
  const s = keyOf(spec);
  const side = /借/.test(s) ? "D" : /贷/.test(s) ? "C" : "";
  const want = s.replace(/借方|贷方/g,"").replace(/[·•.。\/、_—－\s]/g,"");
  const test = (BAL_GROUP_TESTS.find(g=>g.k.test(want)) || {t:g=>g.includes(want) || want.includes(g)}).t;
  const same = cols.info.filter(ci=>ci.side && test(ci.group));
  let hit = side ? same.find(ci=>ci.side === side) : same[0];
  if(!hit && side){                      // 该组没有分借贷的单列
    const any = cols.info.filter(ci=>!ci.side && test(ci.group));
    if(any.length) hit = any[0];
  }
  if(!hit) return null;
  const other = same.find(ci=>ci.side && ci.side !== hit.side) || null;
  return {c: hit.c, side: (hit.side || side || ""), other: other ? other.c : -1,
          label: (hit.group || "") + (hit.side === "D" ? "·借方" : hit.side === "C" ? "·贷方" : "")};
}
function balIndex(matrix, cols){
  const byCode = {}, codes = [];
  for(let i=cols.dataStart;i<matrix.length;i++){
    const row = matrix[i] || [];
    const code = keyOf(row[0]), name = keyOf(row[1]);
    if(!code || /^(合计|小计|总计)/.test(name)) continue;
    byCode[code] = row; codes.push(code);
  }
  return {byCode, codes};
}
/* 台账项目 → 落点。先按 LABELS 认固定行/老行，再按名字找，实在没有就建一行（收入类建收入项，其余建手工税费） */
function balTarget(item, dry){
  const label = keyOf(item);
  const f = labelId(label);
  if(f && FIXED[f]) return {fixed:f};
  if(f){
    let r = S.rows.find(x=>x.id === f) || S.rows.find(x=>keyOf(x.name) === label) || findRowByLabel(label, f);
    if(!r){
      const d = DEF_ROWS.find(x=>x.id === f);
      if(d){
        if(dry) return {row:Object.assign({}, d), created:d.name, dry:true};   // 预览：只说要建，不真建
        r = Object.assign({}, d); S.rows.push(r); return {row:r, created:r.name};
      }
    }
    if(r) return {row:r};
  }
  let r = S.rows.find(x=>keyOf(x.name) === label) || findRowByLabel(label, "");
  if(r) return {row:r};
  const income = /收入/.test(label);
  if(dry) return {row:{id:"__dry__", kind: income ? "income" : "input", name:label, rate:guessIncomeRate(label)},
                  created:label, dry:true};
  r = income ? {id:newRowId(), kind:"income", name:label, rate:guessIncomeRate(label)}
             : {id:newRowId(), kind:"input",  name:label};
  S.rows.push(r);
  return {row:r, created:r.name};
}
/* 这一项写到哪一格；不能直接写数的（收入合计 / 毛利 / 税金合计 / 期末留抵）返回 null */
function balPutKey(t){
  if(t.fixed){
    const k = t.fixed;
    if(k === "output" || k === "vat" || k === "preCity" || k === "carryIn") return OV(k);
    if(k === "cost" || k === "preVat" || k === "inputTax") return k;
    return null;
  }
  return t.row.kind === "vatRate" ? OV(t.row.id) : t.row.id;
}
function balPut(m, t, v){
  const k = balPutKey(t);
  if(!k) return null;
  m[k] = String(r2(v));
  return k;
}
/* 第一遍：只算「打算写什么」，一格都不改台账（给预览弹窗用）
   —— 按余额表里的「核算单位 / 文件名」认公司，取这家公司该用的映射（专属 + 通用 + 兜底） */
function planBalance(matrix, fileName){
  const per = balPeriod(matrix, fileName);
  if(!per.month) throw new Error("没认出所属年月 —— 表头或文件名里要有「2026年10月」或「2026-10」");
  const cols = balCols(matrix);
  if(!cols) throw new Error("没找到「科目编码 / 科目名称」表头，这不像是科目余额表");
  const {byCode, codes} = balIndex(matrix, cols);
  if(!codes.length) throw new Error("余额表里没有数据行");

  const mi = per.month - 1;
  const company = balCompany(matrix, fileName);
  const pack = mapRowsFor(company);
  const lines = [], miss = [], byItem = new Map();
  let incomeHit = 0, usedFallback = 0;

  /* 吃一条映射：同一台账项目命中多条明细（比如几笔服务收入分两个科目）就累加，仍算一行 */
  function feed(it){
    const item = keyOf(it.item), code = keyOf(it.code), wantName = keyOf(it.name);
    if(!item) return;
    let row = byCode[code], usedCode = code;
    if(!row && wantName){                            // 科目编码对不上就按科目名称找一次
      const alt = codes.find(c=>keyOf((byCode[c]||[])[1]) === wantName);
      if(alt){ row = byCode[alt]; usedCode = alt; }
    }
    if(!row){
      if(!byItem.has(item)) miss.push(item + "（余额表里没有科目 " + code + (wantName ? " " + wantName : "") +
                                        "，本期无发生额或尚未启用）");
      return;
    }
    const pick = balPickCol(cols, it.col);
    if(!pick){
      if(!byItem.has(item)) miss.push(item + "（取数口径「" + it.col + "」对不上余额表的列）");
      return;
    }
    const raw = cellNum(row[pick.c]);
    const acct = usedCode + " " + (wantName || keyOf(row[1]) || "");
    const prev = byItem.get(item);

    /* 严格按映射口径的那一列取数：本期发生额为空就说明这个月没发生，不取值、也不改取对方方向 */
    if(raw === null || Math.abs(raw) < 0.005){
      if(prev) return;                               // 同一项目别的明细已经取到数，这条空的直接忽略
      let hint = "";
      if(raw === null && pick.other >= 0){
        const o = cellNum(row[pick.other]);
        if(o !== null && Math.abs(o) >= 0.005)
          hint = "（" + (pick.side === "C" ? "借方" : "贷方") + "有 " + fmt(Math.abs(o)) + "，要取请改口径）";
      }
      const l = {item, acct, col: pick.label, v: 0, skip: true, isIncome:false, ovKey: "",
                 note: (raw === null ? "本期发生额为空，未取值" : "本期发生额为 0，未取值") + hint};
      byItem.set(item, l); lines.push(l);
      return;
    }

    const t = balTarget(item, true);                 // dry：只判断落到哪一行，不建行
    if(!balPutKey(t)){ miss.push(item + "（这一项不能直接填数）"); return; }
    /* 收入项按「借方」口径取到的是冲减（退货/红字），取负号；成本、税费按借侧是正常发生额，保持正数 */
    const isIncome = !t.fixed && t.row.kind === "income";
    const v = (isIncome && pick.side === "D") ? -raw : raw;
    let note = (isIncome && pick.side === "D") ? "按借方口径取数，作冲减" : "";
    if(t.created) note = (note ? note + "；" : "") + "新建行「" + t.created + "」";

    if(prev && !prev.skip){                          // 同一项目第 2、3 条明细 → 累加
      prev.v = r2(prev.v + v);
      prev.acct += " + " + usedCode;
      if(note) prev.note = prev.note ? prev.note + "；" + note : note;
      return;
    }
    if(prev && prev.skip){                           // 之前那条是空的，这条取到了 → 顶替掉
      prev.skip = false; prev.v = r2(v); prev.acct = acct; prev.col = pick.label;
      prev.note = note; prev.isIncome = isIncome;
    }else{
      const l = {item, acct, col: pick.label, v: r2(v), skip: false, note, isIncome, ovKey: ""};
      byItem.set(item, l); lines.push(l);
    }
    if(isIncome) incomeHit++;
  }

  /* 第一轮只跑常规映射；一条收入明细都没取到时，才启用「收入汇总 5001」兜底 */
  pack.rows.filter(x=>x.only !== "fallback").forEach(feed);
  if(!incomeHit && pack.fb){
    const before = incomeHit;
    pack.rows.filter(x=>x.only === "fallback").forEach(feed);
    usedFallback = incomeHit > before ? 1 : 0;
  }

  return {per, mi, lines, miss, company,
          mapCount: pack.own + pack.gen, mapOwn: pack.own, mapGen: pack.gen,
          usedFallback, noCompany: !company,
          mapCustom: Array.isArray(S.mapRows) && S.mapRows.length > 0,
          wrote: lines.filter(l=>!l.skip).length};
}
/* 第二遍：用户点「确认写入」后，才真按 plan 改台账 */
function applyBalance(plan){
  const mi = plan.mi, m = S.months[mi];
  const before = JSON.stringify(m);
  const createdIds = [];

  plan.lines.forEach(l=>{
    if(l.skip) return;
    const t = balTarget(l.item);                     // 这次是真建行
    const k = balPut(m, t, l.v);
    if(!k){ l.skip = true; l.note = "这一项不能直接填数"; return; }
    if(t.created) createdIds.push(t.row.id);
    l.ovKey = k.indexOf("Override") > 0 ? k : "";
  });

  /* 写进去的数跟自动算的一致就回归自动，不留下无意义的手改标记 */
  let ser = calcSeries();
  if(has(m[OV("output")]) && Math.abs(num(m[OV("output")]) - num(ser[mi].auto.output)) <= 0.005) delete m[OV("output")];
  ser = calcSeries();
  normalizeVat(m, ser[mi].carryInAuto);
  ser = calcSeries();
  S.rows.filter(r=>r.kind === "vatRate").forEach(r=>{
    if(has(m[OV(r.id)]) && Math.abs(num(m[OV(r.id)]) - num(ser[mi].auto[r.id])) <= 0.005) delete m[OV(r.id)];
  });
  normalizePreCity(m);

  plan.lines.forEach(l=>{ l.manual = l.ovKey ? has(m[l.ovKey]) : false; });
  plan.wrote = plan.lines.filter(l=>!l.skip).length;

  /* 视图跟着文件走：年度按月对齐，选中那个月，其它月不动 */
  if(plan.per.year && plan.per.year !== S.year) S.year = plan.per.year;
  if(plan.company && !S.company) S.company = plan.company;
  sel = mi; collapse = false;

  return {before, createdIds};
}
/* 「映射表.xlsx」：表头含 台账项目 + 余额表科目编码 就当成映射表 */
function parseMapSheet(matrix){
  let h = -1;
  for(let i=0;i<Math.min(matrix.length, 15);i++){
    const row = (matrix[i]||[]).map(keyOf);
    if(row.some(c=>/台账项目/.test(c)) && row.some(c=>/余额表科目|科目编码|科目代码/.test(c))){ h = i; break; }
  }
  if(h < 0) return null;
  const head = (matrix[h]||[]).map(keyOf);
  const idx = {
    item: head.findIndex(c=>/台账项目/.test(c)),
    code: head.findIndex(c=>/余额表科目|科目编码|科目代码/.test(c)),
    name: head.findIndex(c=>/科目名称/.test(c)),
    col:  head.findIndex(c=>/取数口径|口径|余额表列/.test(c)),
    /* 适用公司：留空 = 所有公司通用 */
    co:   head.findIndex(c=>/适用公司|核算单位|账套|^公司$|公司名称/.test(c)),
    /* 条件：写「兜底」= 只在没有收入明细取到数时才用 */
    cond: head.findIndex(c=>/^条件$|兜底|备注类型/.test(c))
  };
  if(idx.item < 0 || idx.code < 0) return null;
  const out = [];
  for(let i=h+1;i<matrix.length;i++){
    const row = matrix[i] || [];
    const item = keyOf(row[idx.item]), code = keyOf(row[idx.code]);
    if(!item || !code) continue;
    const cond = idx.cond >= 0 ? keyOf(row[idx.cond]) : "";
    out.push({item, code,
              name: idx.name >= 0 ? keyOf(row[idx.name]) : "",
              col:  idx.col  >= 0 ? keyOf(row[idx.col])  : "本期发生额·贷方",
              co:   idx.co   >= 0 ? keyOf(row[idx.co])   : "",
              only: /兜底|后备|汇总/.test(cond) ? "fallback" : ""});
  }
  return out.length ? out : null;
}
let balUndoState = null;
let balPending = null;                 // 等着确认的导入：{matrix, fileName, plan}
async function importBalance(file){
  try{
    const matrix = await readMatrix(file);
    const asMap = parseMapSheet(matrix);
    if(asMap){
      S.mapRows = asMap; save();
      toast("映射表已更新：" + asMap.length + " 项，下次导入余额表按新映射取数");
      return;
    }
    balPending = {matrix, fileName: file.name, plan: null};
    refreshBalPreview();               // 只算不写，先给预览（内部按公司挑映射）
  }catch(err){
    alert("余额表读取失败：" + err.message);
  }
}
function refreshBalPreview(){
  if(!balPending) return;
  balPending.plan = planBalance(balPending.matrix, balPending.fileName);
  showBalPreview(balPending.plan);
}
/* 确认写入：这一步才真改台账 */
function commitBalance(){
  if(!balPending) return;
  const plan = balPending.plan;
  let res;
  try{ res = applyBalance(plan); }
  catch(err){ alert("写入失败：" + err.message); return; }
  balUndoState = {mi:plan.mi, before:res.before, createdIds:res.createdIds};
  balPending = null;
  buildGrid(); syncControls(); paint(); save();
  showBalDone(plan);
  toast("已写入 " + plan.wrote + " 项到 " + plan.per.month + " 月");
}
function balTable(r){
  const rows = r.lines.map(l=>
    "<tr><td>" + esc(l.item) + "</td><td>" + esc(l.acct) + "</td><td>" + esc(l.col) + "</td>" +
    '<td class="num">' + (l.skip ? "—" : fmt(l.v)) + "</td>" +
    '<td class="note' + (l.skip ? "" : l.manual ? " fb" : "") + '">' +
    esc(l.note || (l.manual ? "手改值" : "自动命中")) + "</td></tr>").join("");
  const missHtml = r.miss.length
    ? '<div class="tip" style="color:var(--red)">没取到数：' + r.miss.map(esc).join("；") + "</div>" : "";
  return "<table><thead><tr><th>台账项目</th><th>余额表科目</th><th>取数口径</th><th>金额</th><th>说明</th></tr></thead>" +
         "<tbody>" + rows + "</tbody></table>" + missHtml;
}
function balBtns(preview){
  $("balUndo").hidden  = preview;
  $("balCancel").hidden = !preview;
  $("balOk").hidden     = !preview;
  $("balClose").hidden  = preview;
  $("balMapBtn").hidden = !preview;
  $("balExportMap").hidden = !preview;
  $("balResetMap").hidden = !preview;
}
/* 映射来源说明：这家公司专属几项、通用几项、有没有走收入汇总兜底 */
function mapNote(r){
  return "映射 " + r.mapCount + " 项（" + (r.company ? "本家专属 " + r.mapOwn + " + " : "") +
         "通用 " + r.mapGen + (r.mapCustom ? "，自定义" : "，内置") + "）" +
         (r.usedFallback ? " · 已启用收入汇总兜底" : "");
}
function showBalPreview(r){
  const skipped = r.lines.filter(l=>l.skip);
  const hasData = Object.keys(S.months[r.mi] || {}).length > 0;
  $("balHead").innerHTML = "余额表导入预览 · " + r.per.year + " 年 " + r.per.month + " 月" +
    '<span class="muted">' + (r.company ? "核算单位 " + esc(r.company) + " · " : "") +
    "只写 " + r.per.month + " 月这一列，其它月份不动 · " + mapNote(r) + " · 尚未写入</span>";
  $("balBody").innerHTML = balTable(r) +
    (r.noCompany ? '<div class="tip" style="color:var(--red)">没从余额表里认出是哪家公司（表头缺「核算单位：」、' +
      "文件名也不带公司名），只能用通用映射，收入多半取不到。</div>" : "") +
    (hasData ? '<div class="tip" style="color:var(--manual-bd)">注意：' + r.per.month +
      " 月这一列原来已经有数，确认后会被本次结果覆盖（写错了可以撤销）。</div>" : "") +
    '<div class="tip"><b>还没写进台账。</b>确认后把上面 ' + r.wrote + " 项写进 " + r.per.month + " 月" +
    (skipped.length ? "，跳过 " + skipped.length + " 项（" + skipped.map(l=>esc(l.item)).join("、") + "）" : "") +
    "。只按映射口径那一列取「本期发生额」，那一列是空的就当这个月没发生、不取值；要看借方或贷方，先改「取数口径」再导一次。" +
    (r.usedFallback ? "本家余额表里收入只有「主营业务收入」汇总科目，按兜底规则整笔记到「货物收入」，税率可能不准——销项税仍以余额表为准。" : "") +
    "</div>";
  balBtns(true);
  $("balMask").classList.add("on");
}
function showBalDone(r){
  const skipped = r.lines.filter(l=>l.skip);
  $("balHead").innerHTML = "已写入 · " + r.per.year + " 年 " + r.per.month + " 月" +
    '<span class="muted">' + (r.company ? "核算单位 " + esc(r.company) + " · " : "") +
    "写入 " + r.wrote + " 项，其它月份未改动 · " + mapNote(r) + "</span>";
  $("balBody").innerHTML = balTable(r) +
    '<div class="tip">已写进 ' + r.per.month + " 月这一列" +
    (skipped.length ? "，跳过 " + skipped.length + " 项（" + skipped.map(l=>esc(l.item)).join("、") + "）" : "") +
    "。写错了点左下「撤销本次写入」就能把这个月恢复成导入前的样子。</div>";
  balBtns(false);
  $("balMask").classList.add("on");
}
function hideBal(){
  balPending = null;
  $("balMask").classList.remove("on");
}

/* ---------- 事件 ---------- */
$("company").addEventListener("input", e=>{
  S.company = e.target.value.slice(0,30);
  $("subTitle").textContent = (S.company ? S.company + " · " : "") + S.year + " 年度 · " +
    rowsOf().filter(r=>r.kind === "income").map(r=>r.name + " " + num(r.rate) + "%").join(" / ");
  save();
});
$("company").addEventListener("blur", ()=> syncControls());
$("year").addEventListener("change", e=>{ S.year = +e.target.value || S.year; syncControls(); save(); });
$("halve").addEventListener("change", e=>{ S.halve = e.target.checked; syncControls(); paint(); save(); });
$("addIncome").addEventListener("click", ()=> addRow("income"));
$("addVatFee").addEventListener("click", ()=> addRow("vatRate"));
$("addFee").addEventListener("click", ()=> addRow("input"));
$("btnTheme").addEventListener("click", ()=>{
  S.theme = S.theme === "light" ? "dark" : (S.theme === "dark" ? "auto" : "light");
  applyTheme(); save();
});
$("btnExport").addEventListener("click", exportExcel);
/* 导入：支持文件夹记忆的浏览器直接开选择器（定位到上次的文件夹），其余退回隐藏 input */
$("btnImport").addEventListener("click", async ()=>{
  const f = await pickFile("excel");
  if(f === undefined){ $("xlsInput").click(); return; }
  if(f) importExcel(f);
});
$("xlsInput").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(f) importExcel(f);
  e.target.value = "";
});
/* 余额表：同一个按钮既认科目余额表，也认映射表（靠表头判断） */
$("btnBalance").addEventListener("click", async ()=>{
  const f = await pickFile("excel");
  if(f === undefined){ $("balInput").click(); return; }
  if(f) importBalance(f);
});
$("balInput").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(f) importBalance(f);
  e.target.value = "";
});
$("balClose").addEventListener("click", hideBal);
$("balOk").addEventListener("click", commitBalance);
$("balCancel").addEventListener("click", ()=>{
  balPending = null; hideBal();
  toast("已取消，台账没有改动");
});
$("balMask").addEventListener("click", e=>{ if(e.target === $("balMask")) hideBal(); });
/* Esc 等同于点空白处：预览态就是取消，已写入态只是关掉弹窗 */
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && $("balMask").classList.contains("on")) hideBal();
});
/* 映射表：导入（工具栏 / 弹窗内共用一套逻辑）、导出 */
async function pickMapFile(fallbackInput){
  const f = await pickFile("excel");
  if(f === undefined){ $(fallbackInput).click(); return; }
  if(f) importMapFile(f);
}
$("btnMapIn").addEventListener("click", ()=>pickMapFile("mapInput"));
$("btnMapOut").addEventListener("click", exportMapSheet);
$("mapInput").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(f) importMapFile(f);
  e.target.value = "";
});
$("balMapBtn").addEventListener("click", ()=>pickMapFile("balInput"));   // 换映射后预览自动重算
$("balExportMap").addEventListener("click", exportMapSheet);
$("balResetMap").addEventListener("click", ()=>{
  S.mapRows = null; save();
  toast("已恢复内置映射（" + DEF_MAP.length + " 项），预览已按新映射重算");
  if(balPending) refreshBalPreview();
});
$("balUndo").addEventListener("click", ()=>{
  if(!balUndoState) return;
  const {mi, before, createdIds} = balUndoState;
  S.months[mi] = JSON.parse(before);
  if(createdIds.length){
    S.rows = S.rows.filter(r=>createdIds.indexOf(r.id) < 0);
    if(Array.isArray(S.order)) S.order = S.order.filter(id=>createdIds.indexOf(id) < 0);
  }
  balUndoState = null;
  hideBal();
  buildGrid(); syncControls(); paint(); save();
  toast("已撤销，" + (mi + 1) + " 月回到写入前的样子");
});
$("btnSave").addEventListener("click", async ()=>{
  const name = "税金台账存档_" + S.year + ".json";
  const saved = await saveFile(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), name, "lastSave");
  if(saved) toast("存档已保存 " + saved);
});
/* 存档读取：同样记住上次的文件夹 */
async function loadArchive(file){
  const text = await file.text();
  try{
    const s = JSON.parse(text);
    const rows = migrateRows(s, DEF_ROWS);
    Object.assign(S, s);
    S.months = Array.from({length:N}, (_,i)=>Object.assign({}, (s.months||[])[i]||{}));
    S.rows = rows;
    S.order = Array.isArray(s.order) ? s.order.slice() : [];
    S.seq = Math.max(1, +s.seq || 1);
    S.rows.forEach(r=>{
      const n = +String(r.id).replace(/^\D+/,"");
      if(isFinite(n) && n >= S.seq) S.seq = n + 1;
    });
    delete S.rates; delete S.taxes; delete S.showStamp; delete S.showIncomeTax;
    foldPrepaidRows();
    migratePreCity();
    buildGrid(); syncControls(); paint(); save();
    toast("存档已载入，共 " + S.rows.length + " 个项目行");
  }catch(err){ alert("存档格式不对：" + err.message); }
}
$("btnLoad").addEventListener("click", async ()=>{
  const f = await pickFile("json");
  if(f === undefined){ $("fileInput").click(); return; }
  if(f) loadArchive(f);
});
$("fileInput").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(f) loadArchive(f);
  e.target.value = "";
});
$("btnClear").addEventListener("click", ()=>{
  if(!confirm("清空当前年度全部 12 个月的数据？此操作不可撤销。")) return;
  S.months = Array.from({length:N}, blank);
  paint(); save();
});

/* ---------- 启动 ---------- */
foldPrepaidRows();      // 老存档里的「预缴房产增值税/城建税」手工行并进固定行
migratePreCity();       // 老的预缴房产城建税手填值 → 双态行手改值
for(let i=N-1;i>=0;i--){ if(!isBlank(S.months[i])){ sel = i; break; } }
buildGrid();
syncControls();
paint();
save();
})();
</script>
