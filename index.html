<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>税金台账 · 12个月</title>
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --line:#e3e7ee; --line-strong:#c9d1dc;
  --text:#18202c; --muted:#6b7787; --accent:#2563eb; --accent-soft:#eef4ff;
  --in-bg:#fffaf0; --calc-bg:#f5f7fa; --manual:#fdeeb3; --manual-bd:#d99b1e;
  --red:#cf2f22; --sum-bg:#eaf1fd;
  --head-bg:#eaeff6; --head-text:#33415c; --head-hover:#dfe8f6; --tot-head:#e2ebf9;
  --tot-bg:#f7f9fc; --tot-sum:#dde8fb; --hl-bg:#eef6f1; --hl-text:#0d5c46;
  --chip:#f1f4f8; --shadow:0 8px 24px rgba(18,32,52,.10); --zero:#9aa6b5;
  --cum-bg:#eef4ff; --cum-head:#d8e4fb; --cum-text:#1e4bc8;
  --vat-bg:#efe6ff; --vat-text:#53279b;
  --inc-bg:#e6f6ec; --inc-text:#0d5b3d;
  --sum2-bg:#e4eeff; --sum2-text:#17439c;
  --sep-band:rgba(37,99,235,.09); --sep-line:rgba(37,99,235,.45);
}
:root[data-theme="dark"]{
  --bg:#0f1319; --card:#171d26; --line:#252e3b; --line-strong:#374354;
  --text:#e4eaf3; --muted:#8a97a9; --accent:#5b93f8; --accent-soft:#1b2740;
  --in-bg:#1d232e; --calc-bg:#141a22; --manual:#3d3218; --manual-bd:#c19434;
  --red:#ef7368; --sum-bg:#1a2742;
  --head-bg:#1e2733; --head-text:#b6c4d6; --head-hover:#27323f; --tot-head:#22303f;
  --tot-bg:#1a212b; --tot-sum:#22334f; --hl-bg:#15271f; --hl-text:#5ed3a3;
  --chip:#222a36; --shadow:0 8px 24px rgba(0,0,0,.45); --zero:#5c6878;
  --cum-bg:#1a2742; --cum-head:#243350; --cum-text:#8db4ff;
  --vat-bg:#251d40; --vat-text:#c3a6ff;
  --inc-bg:#14291f; --inc-text:#68d8a6;
  --sum2-bg:#17233c; --sum2-text:#8fb6ff;
  --sep-band:rgba(91,147,248,.14); --sep-line:rgba(91,147,248,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;}
.wrap{max-width:1720px;margin:0 auto;padding:18px 20px 60px;}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.3px;}
.sub{color:var(--muted);font-size:12.5px;margin-left:10px;}
.saved{color:var(--muted);font-size:12px;}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;}
.group{display:flex;align-items:center;gap:10px;}
.spacer{flex:1 1 auto;}
.field{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;}
.field input{width:76px;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;
  font:inherit;font-variant-numeric:tabular-nums;background:var(--card);color:var(--text);}
.field input#company{width:168px;text-align:left;}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:12.5px;}
.switch input{position:absolute;opacity:0;pointer-events:none;}
.track{width:36px;height:20px;border-radius:20px;background:#868f9c;position:relative;transition:background .15s;flex:0 0 auto;}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch input:checked + .track{background:var(--accent);}
.switch input:checked + .track .knob{transform:translateX(16px);}
.hint{color:var(--muted);font-size:11.5px;background:var(--chip);border-radius:6px;padding:2px 7px;}
details.rates{position:relative;font-size:12.5px;color:var(--muted);}
details.rates summary{cursor:pointer;list-style:none;padding:5px 10px;border:1px solid var(--line-strong);
  border-radius:8px;background:var(--card);color:var(--text);}
details.rates summary::-webkit-details-marker{display:none}
.rates-grid{position:absolute;top:36px;left:0;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(3,auto);gap:10px 14px;
  box-shadow:var(--shadow);}
.rates-grid label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;}
.rates-grid input{width:62px;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;
  font:inherit;background:var(--card);color:var(--text);}
button{font:inherit;font-size:12.5px;padding:6px 13px;border:1px solid var(--line-strong);
  border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;transition:.12s;}
button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
button.danger:hover{border-color:var(--red);color:var(--red);background:rgba(207,47,34,.08);}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.primary:hover{filter:brightness(1.08);color:#fff;}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:62vh;}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  font-variant-numeric:tabular-nums;}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;}
thead th{position:sticky;top:0;z-index:3;background:var(--head-bg);font-weight:600;font-size:12.5px;
  height:36px;padding:0 10px;white-space:nowrap;color:var(--head-text);}
thead th.mh{cursor:pointer;}
thead th.mh:hover{background:var(--head-hover);}
thead th.mh.sel{background:var(--accent);color:#fff;}
thead th.corner{left:0;z-index:5;text-align:left;padding-left:14px;min-width:186px;}
thead th.tot{right:0;z-index:6;background:var(--tot-head);border-left:2px solid var(--line-strong);}
tbody th{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;
  padding:0 14px;font-weight:400;white-space:nowrap;min-width:186px;height:34px;
  border-right:1px solid var(--line-strong);}
tbody th i{font-style:normal;color:var(--muted);font-size:11px;margin-left:8px;
  background:var(--chip);border-radius:5px;padding:1px 5px;}
tbody td{min-width:104px;height:34px;text-align:right;padding:0 8px;font-variant-numeric:tabular-nums;}
td.calc{background:var(--calc-bg);color:var(--text);}
td.edit{background:var(--in-bg);position:relative;}
td.edit input{width:100%;height:33px;border:0;background:transparent;text-align:right;
  padding:0 8px;font:inherit;font-variant-numeric:tabular-nums;color:var(--text);outline:none;}
td.edit input:focus{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent);border-radius:4px;}
td.hybrid{background:var(--calc-bg);}
td.hybrid.manual{background:var(--manual);}
td.hybrid.manual input{padding-right:20px;}
td .undo{display:none;position:absolute;right:1px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;line-height:15px;padding:0;border-radius:5px;font-size:11px;
  border:1px solid var(--manual-bd);color:var(--manual-bd);background:var(--card);}
td.hybrid.manual .undo{display:block;}
td .undo:hover{background:var(--manual-bd);color:#fff;}
td.tot{position:sticky;right:0;z-index:1;background:var(--tot-bg);font-weight:600;border-left:2px solid var(--line-strong);}
/* 需要突出显示的三行：整行填色（输入格、计算格、合计列、累计列一起走） */
tr.vat td,tr.vat th{background:var(--vat-bg);color:var(--vat-text);font-weight:600;}
tr.vat td input{color:var(--vat-text);}
tr.inc td,tr.inc th{background:var(--inc-bg);color:var(--inc-text);font-weight:600;}
tr.inc td input{color:var(--inc-text);}
tr.sum td,tr.sum th{background:var(--sum2-bg);color:var(--sum2-text);font-weight:600;}
tr.sum td input{color:var(--sum2-text);}
tr.vat td.neg,tr.inc td.neg,tr.sum td.neg{color:var(--red);}
tr.vat td.cum,tr.inc td.cum,tr.sum td.cum{font-weight:600;}
tr.vat td.cum{background:var(--vat-bg);color:var(--vat-text);}
tr.inc td.cum{background:var(--inc-bg);color:var(--inc-text);}
tr.sum td.cum{background:var(--sum2-bg);color:var(--sum2-text);}
tr.vat td.neg,tr.inc td.neg{color:var(--red);}
/* 分节线：经营数据（毛利率）与增值税（销项税）之间 */
tr.sep td,tr.sep th{border-top:3px solid var(--sep-line);
  background-image:linear-gradient(to bottom,var(--sep-band),transparent 10px);}
/* 行拖动排序 */
tbody th .grip{display:inline-block;width:8px;height:12px;margin-right:5px;vertical-align:-1px;
  cursor:grab;opacity:.3;
  background-image:radial-gradient(var(--muted) 1px, transparent 1.2px);
  background-size:4px 4px;background-position:0 1px;background-repeat:repeat;}
tbody tr:hover th .grip{opacity:.75;}
tbody tr[draggable="true"] th{cursor:grab;}
tr.dragging{opacity:.5;}
tr.drop-before td,tr.drop-before th{box-shadow:inset 0 3px 0 var(--accent);}
tr.drop-after td,tr.drop-after th{box-shadow:inset 0 -3px 0 var(--accent);}
/* 自定义税种行 */
tbody th .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;line-height:15px;padding:0;border-radius:5px;font-size:11px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--muted);opacity:.5;}
tbody tr:hover th .del{opacity:1;}
tbody th .del:hover{border-color:var(--red);color:var(--red);background:rgba(207,47,34,.08);}
tbody th.canren{cursor:text;padding-right:32px;}
tbody th.canren:hover{background:var(--accent-soft);}
tbody th .nm{font-style:normal;}
tr.opt-off{display:none;}
thead th.cumh{cursor:pointer;background:var(--cum-head);color:var(--cum-text);
  border-right:2px solid var(--line-strong);}
thead th.cumh:hover{filter:brightness(.96);}
thead th.cumh b{font-weight:400;opacity:.75;margin-left:2px;}
td.cum{background:var(--cum-bg);color:var(--cum-text);font-weight:600;}
tr.hl td.cum{background:var(--cum-bg);color:var(--cum-text);}
tr.sum td.cum{background:var(--cum-bg);color:var(--cum-text);}
td.cum.neg{color:var(--red);}
.neg{color:var(--red);}
.zero{color:var(--zero);}
.panel{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;margin-top:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.card-h{font-size:12.5px;font-weight:600;color:var(--head-text);letter-spacing:.4px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline;}
.card-h span{font-weight:400;color:var(--muted);font-size:11.5px;}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;
  border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums;margin:0;}
.row:last-child{border-bottom:0;}
.row dt{color:var(--muted);font-size:12.5px;}
.row dd{margin:0;font-size:13px;}
.row.big dd{font-size:17px;font-weight:600;color:var(--accent);}
.row.big dt{color:var(--text);font-weight:500;}
.detail{font-size:12.5px;color:var(--text);line-height:1.9;}
.detail b{font-weight:600;font-variant-numeric:tabular-nums;}
.detail .tag{display:inline-block;background:var(--manual);color:#8a5c00;border-radius:5px;
  padding:0 6px;font-size:11.5px;margin-left:6px;}
:root[data-theme="dark"] .detail .tag{color:#e5b25a;}
.detail p{margin:0 0 6px;}
.detail .muted{color:var(--muted);}
.muted{color:var(--muted);}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--line-strong);border-radius:10px;padding:10px 18px;box-shadow:var(--shadow);
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;}
.toast.on{opacity:1;}
/* ---------- 余额表导入结果 ---------- */
.mask{position:fixed;inset:0;background:rgba(12,18,28,.44);display:none;z-index:120;
  align-items:center;justify-content:center;padding:24px;}
.mask.on{display:flex;}
.dlg{background:var(--card);border:1px solid var(--line-strong);border-radius:14px;
  box-shadow:var(--shadow);width:min(980px,100%);max-height:84vh;display:flex;flex-direction:column;}
.dlg-h{padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.dlg-h .muted{font-weight:400;font-size:12px;}
.dlg-b{padding:10px 18px 14px;overflow:auto;}
.dlg-b table{width:100%;border-collapse:collapse;font-size:12.5px;}
.dlg-b th,.dlg-b td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.dlg-b th:nth-child(3),.dlg-b td:nth-child(3),
.dlg-b th:nth-child(4),.dlg-b td:nth-child(4){white-space:nowrap;}
.dlg-b th{color:var(--muted);font-weight:500;background:var(--head-bg);position:sticky;top:0;
  box-shadow:0 1px 0 var(--line);}
.dlg-b td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.dlg-b td.note{color:var(--muted);}
.dlg-b td.note.warn{color:var(--red);}
.dlg-b td.note.fb{color:var(--manual-bd);}
.dlg-b .tip{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.7;}
.dlg-f{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap;}
.dlg-f .left{margin-right:auto;}
@media (max-width:1200px){.panel{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>税金台账</h1><span class="sub" id="subTitle"></span></div>
    <div class="saved" id="savedTip"></div>
  </div>

  <div class="bar">
    <div class="group">
      <label class="field">公司 <input id="company" type="text" maxlength="30" placeholder="填写公司名称" title="填公司名称，会带到页面标题和导出的 Excel 里"></label>
      <label class="field">年度 <input id="year" type="number" min="2000" max="2100" step="1"></label>
    </div>
    <div class="group">
      <label class="switch"><input type="checkbox" id="halve"><span class="track"><span class="knob"></span></span>附加税减半</label>
      <span class="hint" id="halveHint"></span>
    </div>
    <div class="group">
      <button id="addIncome" title="新增一个收入项（如劳务收入），收入合计与销项税会自动带上它">＋ 收入</button>
      <button id="addVatFee" title="新增一个按「增值税额×费率」计征的税费（如水利建设基金）">＋ 附加</button>
      <button id="addFee" title="新增一个手工填金额的税费（如房产税、土地使用税、车船税）">＋ 税费</button>
    </div>
    <div class="spacer"></div>
    <button id="btnTheme" title="切换外观">浅色</button>
    <button id="btnImport" title="默认打开上次导入/保存的那个文件夹（Chrome / Edge）">导入 Excel</button>
    <button id="btnBalance" title="导入「科目余额表」xlsx：按映射表把本期发生额自动填进文件标注的那个月份（选映射表文件也能更新映射）">导入余额表</button>
    <button id="btnMapIn" title="导入「映射表」xlsx 更新当前映射（列：台账项目 / 适用公司 / 余额表科目编码 / 科目名称 / 取数口径 / 条件）">导入映射</button>
    <button id="btnMapOut" title="把当前生效的映射导出成 xlsx：改完再用「导入映射」导回来就完成更新">导出映射</button>
    <button id="btnExport" class="primary" title="默认保存到上次导出的文件夹（Chrome / Edge）">导出 Excel</button>
    <button id="btnSave" title="默认保存到上次导出的文件夹（Chrome / Edge）">导出存档</button>
    <button id="btnLoad" title="默认打开上次导入/保存的那个文件夹（Chrome / Edge）">读取存档</button>
    <button id="btnClear" class="danger">清空</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
    <input type="file" id="xlsInput" accept=".xlsx,.xlsm,.xls,.csv,.htm,.html,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input type="file" id="balInput" accept=".xlsx,.xlsm,.xls,.csv,.htm,.html,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
    <input type="file" id="mapInput" accept=".xlsx,.xlsm,.xls,.csv,.htm,.html,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
  </div>

  <div class="tablewrap"><table id="grid"></table></div>
  <div class="panel">
    <div class="card" id="cardCur"></div>
    <div class="card" id="cardYtd"></div>
    <div class="card"><div class="card-h">计算过程<span id="detailMonth"></span></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="mask" id="balMask">
  <div class="dlg" role="dialog" aria-modal="true">
    <div class="dlg-h" id="balHead"></div>
    <div class="dlg-b" id="balBody"></div>
    <div class="dlg-f">
      <button class="left" id="balUndo" hidden title="把这个月恢复到写入前的样子">撤销本次写入</button>
      <button id="balMapBtn" title="选一个「映射表.xlsx」替换当前映射（列：台账项目 / 适用公司 / 余额表科目编码 / 科目名称 / 取数口径 / 条件）">更新映射表</button>
      <button id="balExportMap" title="把当前生效的映射导出成 xlsx，改完再导回来就是更新">导出映射表</button>
      <button id="balResetMap" title="回到内置的默认映射">恢复默认映射</button>
      <button id="balCancel" hidden title="什么都不改，关掉预览">取消</button>
      <button id="balOk" class="primary" hidden title="按上面这个表写入台账">确认写入</button>
      <button id="balClose" class="primary" hidden>关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const STORE = "tax-ledger-v2";
const N = 12;

/* ================= 行模型 =================
   S.rows 只存「可变行」，三类：
     income  收入项     —— 有税率，参与收入合计与销项税（货物开票/未开票/服务/劳务…）
     vatRate 增值税附加 —— 按「增值税×费率」算（城建/教育/地方教育…），可减半
     input   手工税费   —— 直接填金额（印花税/企业所得税/房产税/土地使用税…）
   固定行（收入合计、销项税、进项税、预缴房产增值税、增值税、预缴房产城建税、税金合计）由 FIXED 提供，不可删、不可改名。
   计税依据：增值税 = 销项 − 进项 − 预缴房产增值税；
             城建税 / 教育费附加 / 地方教育附加 = 增值税 × 各自费率；
             预缴房产城建税 = 预缴房产增值税 × 城建税率。
   城建税与预缴房产城建税各算各的、互不抵减；预缴房产增值税抵减增值税后不进合计，预缴房产城建税独立计入合计。
   合计口径永远是「当前存在的行相加」，删掉一行自动从合计里消失。
   ========================================== */
const DEF_ROWS = [
  {id:"goods",     kind:"income",  name:"货物开票收入",   rate:13},
  {id:"unbilled",  kind:"income",  name:"未开票收入",     rate:13},
  {id:"service",   kind:"income",  name:"服务收入",       rate:6},
  {id:"city",      kind:"vatRate", name:"城市维护建设税", rate:7, half:1},
  {id:"edu",       kind:"vatRate", name:"教育费附加",     rate:3, half:1},
  {id:"localEdu",  kind:"vatRate", name:"地方教育附加",   rate:2, half:1},
  {id:"stamp",     kind:"input",   name:"印花税"},
  {id:"incomeTax", kind:"input",   name:"企业所得税"}
];
const FIXED = {
  income:  {id:"income",   kind:"sumIncome", name:"收入合计"},
  cost:    {id:"cost",     kind:"cost",      name:"主营业务成本"},

/* 公司名宽松比对：去空格、去括号备注、去地域前缀与公司后缀，「磐实」也能对上「广州磐实供应链有限公司」 */
function normCo(s){
  return String(s == null ? "" : s).replace(/\s+/g,"").replace(/[（(].*?[)）]/g,"")
    .replace(/^(广州|广东|深圳|东莞|佛山|中国)/,"")
    .replace(/(有限责任公司|有限公司|集团|股份|公司)$/,"");
}
function coHit(a, b){
  const A = normCo(a), B = normCo(b);
  if(!A || !B) return false;
  return A === B || A.indexOf(B) >= 0 || B.indexOf(A) >= 0;
}
/* 某公司该用的映射：专属行优先（同名项目盖掉通用行），通用行补空，兜底行恒排在最后 ——
   返回 {rows, own, gen, fb}，own/gen 只用来在弹窗里报数 */
function mapRowsFor(company){
  const all = mapRows();
  const own = [], gen = [];
  all.forEach(x=>{
    if(x.only === "fallback") return;
    if(x.co){ if(coHit(x.co, company)) own.push(x); }
    else gen.push(x);
  });
  const seen = new Set(own.map(x=>keyOf(x.item)));
  const rows = own.concat(gen.filter(x=>!seen.has(keyOf(x.item))));
  const fb = all.filter(x=>x.only === "fallback");
  return {rows: rows.concat(fb), own: own.length, gen: gen.length, fb: fb.length};
}

/* ---------- 行的显示顺序 ----------
   S.order 记录全部行 id 的显示次序（可拖动改变，随存档保存）。
   旧存档没有 S.order，或新增行还没进 order 时，按下面的默认分组顺序补齐。 */
function defOrder(){
  const out = [];
  S.rows.filter(r=>r.kind === "income").forEach(r=>out.push(r.id));
  out.push(FIXED.income.id, FIXED.cost.id, FIXED.gross.id, FIXED.margin.id);
  out.push(FIXED.output.id, FIXED.inputTax.id, FIXED.preVat.id,
           FIXED.carryIn.id, FIXED.vat.id, FIXED.carryOut.id);
  /* 预缴房产城建税紧跟城建税行（没有城建税行就放在附加税费末尾） */
  let cityPlaced = false;
  S.rows.filter(r=>r.kind === "vatRate").forEach(r=>{
    out.push(r.id);
    if(isCityRow(r)){ out.push(FIXED.preCity.id); cityPlaced = true; }
  });
  S.rows.filter(r=>r.kind === "input").forEach(r=>{
    out.push(r.id);
    /* 城建税是手工税费行时，预缴行也紧跟它 */
    if(!cityPlaced && isCityRow(r)){ out.push(FIXED.preCity.id); cityPlaced = true; }
  });
  if(!cityPlaced) out.push(FIXED.preCity.id);
  out.push(FIXED.total.id);
  return out;
}
function rowMap(){
  const m = {};
  S.rows.forEach(r=>{ m[r.id] = r; });
  Object.keys(FIXED).forEach(k=>{ m[FIXED[k].id] = FIXED[k]; });
  return m;
}
function order(){
  const map = rowMap();
  if(!Array.isArray(S.order) || !S.order.length) return defOrder();
  const seen = {}, out = [];
  S.order.forEach(id=>{
    if(map[id] && !seen[id]){ seen[id] = 1; out.push(id); }
  });
  /* 存档里没有的行（新增的固定行、导入进来的行）按默认顺序插到前后邻行之间，
     不覆盖用户已经拖出来的顺序 */
  const def = defOrder();
  def.forEach((id, i)=>{
    if(seen[id]) return;
    let at = -1;
    for(let j=i-1;j>=0;j--){
      const p = out.indexOf(def[j]);
      if(p >= 0){ at = p + 1; break; }
    }
    out.splice(at < 0 ? 0 : at, 0, id);
    seen[id] = 1;
  });
  return out;
}
const rowsOf = () => { const map = rowMap(); return order().map(id=>map[id]); };

/* 拖动排序：把 id 移到 targetId 前/后 */
function moveRow(id, targetId, after){
  if(id === targetId) return false;
  const ord = order();
  const from = ord.indexOf(id), ti = ord.indexOf(targetId);
  if(from < 0 || ti < 0) return false;
  let to = ti + (after ? 1 : 0);
  ord.splice(from, 1);
  if(from < to) to -= 1;
  to = Math.max(0, Math.min(to, ord.length));
  if(to === from) return false;
  ord.splice(to, 0, id);
  S.order = ord;
  buildGrid(); paint(); save();
  return true;
}

/* 旧存档（rates + taxes + 两个开关）迁移到 rows 模型 */
function migrateRows(s, def){
  if(Array.isArray(s.rows)){          // 新版存档：允许用户删空，不做补充
    const seen = {}, out = [];
    s.rows.forEach(r=>{
      if(!r || !r.id || seen[r.id] || KINDS.indexOf(r.kind) < 0) return;
      seen[r.id] = 1;
      const o = {id:String(r.id), kind:r.kind, name:String(r.name || "未命名").slice(0,20)};
      if(r.kind !== "input") o.rate = (r.rate === undefined || r.rate === null) ? 0 : +r.rate;
      if(r.kind === "vatRate") o.half = r.half ? 1 : 0;
      out.push(o);
    });
    return out;
  }
  // 旧版：把 rates 灌到对应行，把 taxes 转成 input 行
  const out = def.map(r=>Object.assign({}, r));
  const rt = s.rates || {};
  out.forEach(r=>{ if(rt[r.id] !== undefined) r.rate = +rt[r.id]; });
  (Array.isArray(s.taxes) ? s.taxes : []).forEach(t=>{
    if(t && t.id && !out.some(x=>x.id === t.id))
      out.push({id:String(t.id), kind:"input", name:String(t.name || "自定义税种")});
  });
  if(s.showStamp === false)      { const i = out.findIndex(r=>r.id === "stamp");     if(i >= 0) out.splice(i,1); }
  if(s.showIncomeTax === false)  { const i = out.findIndex(r=>r.id === "incomeTax"); if(i >= 0) out.splice(i,1); }
  return out;
}

/* ---------- 基础工具 ---------- */
const NF = new Intl.NumberFormat("zh-CN",{minimumFractionDigits:2, maximumFractionDigits:2});
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(/,/g,"")); return isFinite(x) ? x : 0; };

const has = v => v !== null && v !== undefined && String(v).trim() !== "";

/* 老存档 / 老 Excel 里可能把「预缴房产增值税/城建税」当手工税费建过行，
   这里把它们并进固定行（m.preVat / m.preCity）后删掉，避免金额重复进税金合计 */
function foldPrepaidRows(){
  const keep = [];
  let moved = false;
  const hitVat  = n => /预缴.*增值税|房产增值税/.test(n);
  const hitCity = n => /预缴.*城建税|房产城建税/.test(n);
  S.rows.forEach(r=>{
    if(r.kind !== "input"){ keep.push(r); return; }
    const n = String(r.name || "").replace(/\s/g,"");
    if(hitVat(n)){
      S.months.forEach(m=>{ if(has(m[r.id])) m.preVat = r2(num(m.preVat) + num(m[r.id])); });
      moved = true; return;
    }
    if(hitCity(n)){
      S.months.forEach(m=>{ if(has(m[r.id])) m[OV("preCity")] = r2(num(m[OV("preCity")]) + num(m[r.id])); });
      moved = true; return;
    }
    keep.push(r);
  });
  if(moved){
    S.rows = keep;
    if(Array.isArray(S.order)){
      const ids = {}; S.rows.forEach(r=>{ ids[r.id] = 1; });
      S.order = S.order.filter(id=>ids[id]);
    }
  }
  return moved;
}
/* ---------- 计算引擎 ---------- */
/* 城建税率（含减半）：预缴房产城建税按同一个税率对「预缴房产增值税」计征 */
function cityRateInfo(){
  const r = S.rows.find(isCityRow);
  const k = S.halve ? 0.5 : 1;
  const rate = r ? num(r.rate) : 7;
  const half = r ? (r.half ? k : 1) : k;
  return { rate, half, pct: rate * half };
}
function calcMonth(m, carryInArg){
  /* 1. 收入合计 = 当前所有收入项之和；销项税 = 各收入项 × 各自税率之和 */
  let income = 0, autoOutput = 0;
  S.rows.forEach(r=>{
    if(r.kind !== "income") return;
    const v = num(m[r.id]);
    income += v;
    autoOutput += v * num(r.rate) / 100;
  });
  income = r2(income);
  autoOutput = r2(autoOutput);

  /* 2. 销项税可手改；增值税 = 销项税 − 进项税 − 预缴房产增值税 − 期初留抵
        结果小于 0 就是留抵，全额结转到下月继续抵，不做退税处理
        增值税本身也可以手改（比如直接用申报表的「本期应纳税额」），
        改了之后附加税费跟着手改值走，留抵仍然按 0 以下的部分结转到下月 */
  const manOutput = has(m[OV("output")]);
  const output = manOutput ? r2(num(m[OV("output")])) : autoOutput;
  const inputTax = num(m.inputTax);
  const preVat = num(m.preVat);          // 异地房产已预缴的增值税，申报时抵减
  const manCarryIn = has(m[OV("carryIn")]);
  const carryIn = (carryInArg !== undefined) ? r2(carryInArg)
                : (manCarryIn ? r2(num(m[OV("carryIn")])) : 0);
  const autoVat = r2(output - inputTax - preVat - carryIn);
  const manVat = has(m[OV("vat")]);
  const vat = manVat ? r2(num(m[OV("vat")])) : autoVat;
  const base = Math.max(vat, 0);              // 附加税基数：留抵时取 0
  const carryOut = r2(Math.max(-vat, 0));     // 期末留抵，结转到下月
  const k = S.halve ? 0.5 : 1;

  /* 3. 预缴房产城建税：以「预缴房产增值税」为计税依据，与城建税互不影响 */
  const cityInfo = cityRateInfo();                            // 城建税率（含减半）
  const autoPreCity = r2(preVat * cityInfo.pct / 100);
  const manPreCity = has(m[OV("preCity")]);
  const preCity = manPreCity ? r2(num(m[OV("preCity")])) : autoPreCity;

  /* 4. 附加税费 = 增值税基数 × 费率（可减半、可手改）；手工税费直接取数 */
  const vals = {}, auto = {}, autoRaw = {}, manual = {};
  let vatFee = 0, otherFee = 0;
  S.rows.forEach(r=>{
    if(r.kind === "income"){ vals[r.id] = r2(num(m[r.id])); return; }
    if(r.kind === "vatRate"){
      const a = r2(base * num(r.rate) / 100 * (r.half ? k : 1));
      autoRaw[r.id] = a;
      auto[r.id] = a;
      manual[r.id] = has(m[OV(r.id)]);
      vals[r.id] = manual[r.id] ? r2(num(m[OV(r.id)])) : a;
      vatFee += vals[r.id];
      return;
    }
    if(r.kind === "input"){ vals[r.id] = num(m[r.id]); otherFee += vals[r.id]; }
  });
  vatFee = r2(vatFee); otherFee = r2(otherFee);

  /* 5. 税金合计 = 应纳增值税 + 预缴房产增值税 + 附加税费 + 手工税费 + 预缴房产城建税
        预缴房产增值税虽然从应纳增值税里减掉了，但它本身也是本月实际承担的税金，合计里要加回来 */
  const total = r2(base + preVat + vatFee + otherFee + preCity);

  /* 5. 毛利 = 收入合计 − 主营业务成本；毛利率 = 毛利 ÷ 收入合计
        成本没填（也没填 0）时毛利与毛利率都留空，避免一填收入就显示 100% */
  const costFilled = has(m.cost);
  const cost = r2(num(m.cost));
  const gross = costFilled ? r2(income - cost) : null;
  const margin = (costFilled && income) ? (gross / income) : null;

  vals.income = income; vals.output = output; vals.inputTax = inputTax;
  vals.preVat = preVat; vals.preCity = preCity;
  vals.carryIn = carryIn; vals.carryOut = carryOut;
  /* 增值税行显示「本月应纳」：销项不足抵扣时显示 0，抵扣不完的部分走期末留抵行，
     这样 12 个月的增值税加起来就是全年真实应交，不会因为负数把别的月份冲掉 */
  vals.vat = base; vals.total = total;
  vals.cost = cost; vals.gross = gross; vals.margin = margin;
  auto.output = autoOutput; manual.output = manOutput;
  auto.vat = base; manual.vat = manVat;        // 单元格里显示的是「本月应纳」，留抵月是 0
  auto.preCity = autoPreCity; manual.preCity = manPreCity;
  manual.carryIn = manCarryIn;

  return { income, output, inputTax, preVat, preCity, preCityAuto:autoPreCity,
           carryIn, carryOut, vat, vatAuto:autoVat, base, total, vals, auto, autoRaw, manual,
           vatFee, other: otherFee, cost, gross, margin, costFilled };
}
/* 逐月算一遍，把留抵按月结转：本期期末留抵 = 下月期初留抵（1 月可手填上年结转）。
   n 只有 12，直接顺序走一遍，比到处传参省事 */
function calcSeries(){
  const out = [];
  let carry = 0;
  for(let i=0;i<N;i++){
    const m = S.months[i];
    const man = has(m[OV("carryIn")]);
    const ci = man ? r2(num(m[OV("carryIn")])) : (i === 0 ? 0 : carry);
    const c = calcMonth(m, ci);
    c.carryInAuto = (i === 0 ? 0 : carry);
    c.carryManual = man;
    out.push(c);
    carry = c.carryOut;
  }
  return out;
}
/* 老存档里「预缴房产城建税」是手填值存在 m.preCity，现在改成双态行（自动 = 预缴增值税×税率），
   把老值搬到 override 位置，保持显示不变 */
function migratePreCity(){
  let moved = false;
  S.months.forEach(m=>{
    if(!has(m.preCity)) return;
    if(!has(m[OV("preCity")])) m[OV("preCity")] = m.preCity;
    delete m.preCity;
    moved = true;
  });
  return moved;
}
/* 预缴房产城建税如果手填的正好等于自动值，就当没手改，回归自动 */
function normalizePreCity(m){
  if(!has(m[OV("preCity")])) return;
  const c = calcMonth(m);
  if(Math.abs(num(m[OV("preCity")]) - c.preCityAuto) <= 0.005) delete m[OV("preCity")];
}
/* 增值税手填值如果正好等于自动算的「本月应纳」（留抵月自动值取 0），也回归自动 ——
   免得手敲一遍 0 就把当月的留抵弄丢了。ci 是当月的期初留抵（算自动值要用） */
function normalizeVat(m, ci){
  if(!has(m[OV("vat")])) return;
  const saved = m[OV("vat")];
  delete m[OV("vat")];
  const c = calcMonth(m, ci);
  if(Math.abs(num(saved) - Math.max(c.vat, 0)) > 0.005) m[OV("vat")] = saved;
}
function isBlank(m){
  if(has(m.inputTax)) return false;
  if(has(m.cost)) return false;
  if(has(m.preVat) || has(m[OV("preCity")]) || has(m[OV("vat")])) return false;
  return S.rows.every(r=> r.kind === "vatRate" ? !has(m[OV(r.id)]) : !has(m[r.id]));
}

/* ---------- 建表 ---------- */
const inputs = {}, calcCells = {}, totalCells = {}, cumCells = {};
let monthHeads = [], inputOrder = [];
let collapse = false;   // 是否把选中月之前的月份折叠成一列累计
let view = [];          // 当前渲染的列：{k:"m",i} 或 {k:"cum",a,b}

function viewCols(){
  if(!collapse || sel === 0) return Array.from({length:N}, (_,i)=>({k:"m", i}));
  const v = [{k:"cum", a:0, b:sel-1}];
  for(let i=sel;i<N;i++) v.push({k:"m", i});
  return v;
}

/* 行的配色类：收入合计绿、增值税紫、税金合计蓝（企业所得税不填色） */
const rowCls = r =>
  r.kind === "sumIncome" ? "inc" :
  r.kind === "vat" ? "vat" :
  r.kind === "total" ? "sum" : "";

/* 行标题后面的小徽标 */
function rateTag(r){
  if(r.kind === "income" || r.kind === "vatRate")
    return '<i class="rt" data-rt="'+r.id+'"'+(r.kind === "vatRate" && r.half ? ' data-half="1"' : '')+
           ' title="点击修改'+(r.kind === "income" ? "销项税率" : "费率")+'"></i>';
  if(r.kind === "inputTax") return '<i>手工</i>';
  if(r.kind === "input" && isCityRow(r)) return '<i>手工</i>';
  if(r.kind === "cost")     return '<i>手工</i>';
  if(r.kind === "preVat")   return '<i>手工 · 抵减增值税</i>';
  if(r.kind === "preCity")  return '<i>预缴增值税×税率</i>';
  if(r.kind === "output")   return '<i>可手改</i>';
  if(r.kind === "carryIn")  return '<i>上月结转 · 可改</i>';
  if(r.kind === "carryOut") return '<i>结转下期</i>';
  if(r.kind === "vat")      return '<i>销项−进项−预缴−留抵 · 可改</i>';
  if(r.kind === "gross")    return '<i>收入−成本</i>';
  if(r.kind === "margin")   return '<i>毛利÷收入</i>';
  return '';
}

function buildGrid(){
  const t = $("grid");
  view = viewCols();
  [inputs, calcCells, cumCells, totalCells].forEach(o=>{
    Object.keys(o).forEach(k=>delete o[k]);
  });

  let h = '<thead><tr><th class="corner">项目</th>';
  view.forEach(v=>{
    if(v.k === "cum"){
      h += '<th class="cumh" title="点击展开 ' + (v.a+1) + '–' + (v.b+1) + ' 月，看各月明细">' +
           (v.a+1) + '–' + (v.b+1) + '月累计<b>▾</b></th>';
    }else{
      h += '<th class="mh" data-i="'+v.i+'" title="点一下：选中该月，并把之前的月份折叠成累计">'+(v.i+1)+'月</th>';
    }
  });
  h += '<th class="tot" title="全年 12 个月合计">' + (collapse && sel > 0 ? "全年合计" : "合计") + '</th></tr></thead><tbody>';

  rowsOf().forEach(r=>{
    const cls = rowCls(r), movable = KINDS.indexOf(r.kind) >= 0;
    /* 销项税这一行是「经营数据 / 增值税」的分界，加一条分隔线 */
    const sep = r.id === FIXED.output.id ? "sep" : "";
    const all = (cls + " " + sep).trim();
    h += '<tr data-row="'+r.id+'"'+(movable ? ' data-drag="1"' : '')+(all ? ' class="'+all+'"' : '')+'>';
    h += '<th'+(movable ? ' class="canren" data-ren="'+r.id+'" title="按住拖动可调整上下顺序；双击重命名；点百分比改税率；✕ 删除"' : '')+'>' +
         (movable ? '<span class="grip" aria-hidden="true"></span>' : '') +
         '<span class="nm">' + esc(r.name) + '</span>' + rateTag(r) +
         (movable ? '<button class="del" data-del="'+r.id+'" title="删除该行（同时清掉 12 个月的数据）">✕</button>' : '') +
         '</th>';
    view.forEach(v=>{
      if(v.k === "cum"){
        h += '<td class="cum" data-f="'+r.id+'" data-cum="1"></td>';
      }else if(isEdit(r) || isHyb(r)){
        const i = v.i;
        h += '<td class="edit'+(isHyb(r)?' hybrid':'')+'" data-f="'+r.id+'" data-i="'+i+'">'+
             '<input class="cellin" data-f="'+r.id+'" data-i="'+i+'" data-k="'+r.kind+'" inputmode="decimal" autocomplete="off" spellcheck="false">'+
             (isHyb(r) ? '<button class="undo" data-f="'+r.id+'" data-i="'+i+'" title="恢复自动计算">↺</button>' : '')+
             '</td>';
      }else{
        h += '<td class="calc" data-f="'+r.id+'" data-i="'+v.i+'"></td>';
      }
    });
    h += '<td class="tot" data-f="'+r.id+'"></td></tr>';
  });
  h += '</tbody>';
  t.innerHTML = h;

  monthHeads = Array.from(t.querySelectorAll("th.mh"));
  t.querySelectorAll(".cellin").forEach(el=>{
    const f = el.dataset.f, i = +el.dataset.i, k = el.dataset.k;
    inputs[f + "_" + i] = el;
    el.addEventListener("focus", e => { e.target.value = e.target.value.replace(/,/g,""); });
    el.addEventListener("input", e => onInput(f, i, k, e.target));
    el.addEventListener("blur", () => paint());
    el.addEventListener("keydown", e => onKey(e, f, i));
  });
  t.querySelectorAll(".undo").forEach(b=>{
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      S.months[+b.dataset.i][OV(b.dataset.f)] = null;
      paint(); save();
    });
  });
  t.querySelectorAll("td.calc").forEach(td=>{ calcCells[td.dataset.f + "_" + td.dataset.i] = td; });
  t.querySelectorAll("td.cum").forEach(td=>{ cumCells[td.dataset.f] = td; });
  t.querySelectorAll("td.tot").forEach(td=>{ totalCells[td.dataset.f] = td; });

  t.querySelectorAll(".del").forEach(b=>{
    b.addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation();
      delRow(b.dataset.del);
    });
  });
  t.querySelectorAll("th.canren").forEach(th=>{
    th.addEventListener("dblclick", e=>{
      if(e.target.closest(".del,.rt")) return;
      renRow(th.dataset.ren);
    });
  });
  t.querySelectorAll("i.rt").forEach(i=>{
    i.addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation();
      editRate(i.dataset.rt);
    });
  });

  monthHeads.forEach(th=>{
    th.addEventListener("click", ()=>{
      const i = +th.dataset.i;
      const wasCollapsed = collapse && sel > 0;
      sel = i;
      collapse = sel > 0;
      buildGrid(); syncControls(); paint();
      if(collapse && !wasCollapsed && sel > 0)
        toast("已折叠 1–" + sel + " 月，点「1–" + sel + "月累计」表头可展开");
    });
  });
  const ch = t.querySelector("th.cumh");
  if(ch) ch.addEventListener("click", ()=>{ collapse = false; buildGrid(); syncControls(); paint(); });

  inputOrder = rowsOf().filter(r=>isEdit(r) || isHyb(r)).map(r=>r.id);
  wireDrag(t);
}

/* ---------- 拖动排序 ---------- */
let dragId = null;
/* 松开鼠标就把 draggable 收回，避免输入格里拖选文字时误拖整行（只绑一次） */
document.addEventListener("mouseup", ()=>{
  document.querySelectorAll('#grid tr[draggable="true"]').forEach(x=>{ x.draggable = false; });
});
function clearDrop(t){
  t.querySelectorAll("tr.drop-before,tr.drop-after").forEach(x=>{
    x.classList.remove("drop-before","drop-after");
  });
}
function wireDrag(t){
  /* 只有「可增删的行」能拖；抓住项目格才开始 */
  if(!t._dragWired){
    t._dragWired = 1;
    t.addEventListener("mousedown", e=>{
      const th = e.target.closest("tbody th");
      if(!th || e.button !== 0 || e.target.closest(".del,.rt")) return;
      const tr = th.parentElement;
      if(tr && tr.dataset.drag) tr.draggable = true;
    });
  }

  Array.from(t.querySelectorAll("tbody tr")).forEach(tr=>{
    /* 固定行（收入合计/销项税/…）不能拖，但可以作为落点 */
    if(tr.dataset.drag){
      tr.addEventListener("dragstart", e=>{
        if(!tr.draggable){ e.preventDefault(); return; }
        dragId = tr.dataset.row;
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
      });
      tr.addEventListener("dragend", ()=>{
        tr.draggable = false;
        tr.classList.remove("dragging");
        clearDrop(t);
        dragId = null;
      });
    }
    tr.addEventListener("dragover", e=>{
      if(!dragId || tr.dataset.row === dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const box = tr.getBoundingClientRect();
      const after = (e.clientY - box.top) > box.height / 2;
      clearDrop(t);
      /* 不能落到「税金合计」下面 */
      tr.classList.add(tr.dataset.row === FIXED.total.id || !after ? "drop-before" : "drop-after");
    });
    tr.addEventListener("dragleave", ()=>{ tr.classList.remove("drop-before","drop-after"); });
    tr.addEventListener("drop", e=>{
      if(!dragId || tr.dataset.row === dragId) return;
      e.preventDefault();
      const box = tr.getBoundingClientRect();
      let after = (e.clientY - box.top) > box.height / 2;
      if(tr.dataset.row === FIXED.total.id) after = false;
      const id = dragId, target = tr.dataset.row;
      clearDrop(t);
      dragId = null;
      setTimeout(()=>{
        if(moveRow(id, target, after))
          toast("已调整「" + (rowMap()[id] || {}).name + "」的顺序");
      }, 0);
    });
  });
}

/* ---------- 行的增删改 ---------- */
function addRow(kind){
  const id = newRowId();
  const n = id.replace(/^\D+/,"");
  let row;
  if(kind === "income")       row = {id, kind, name:"新增收入" + n, rate:6};
  else if(kind === "vatRate") row = {id, kind, name:"新增附加" + n, rate:1, half:1};
  else                        row = {id, kind, name:"新增税费" + n};
  const ord = order();
  S.rows.push(row);
  /* 默认插到同类行的最后面：收入项在「收入合计」前，附加在附加区末尾，手工税费在「税金合计」前 */
  let at = -1;
  const map = rowMap();
  for(let i=ord.length-1;i>=0;i--){
    const x = map[ord[i]];
    if(x && x.kind === kind){ at = i + 1; break; }
  }
  if(at < 0){
    const a = ord.indexOf(kind === "income" ? FIXED.income.id : FIXED.total.id);
    at = a < 0 ? ord.length : a;
  }
  ord.splice(at, 0, id);
  S.order = ord;
  buildGrid(); syncControls(); paint(); save();
  const th = document.querySelector('tbody th[data-ren="' + id + '"]');
  if(th) th.scrollIntoView({block:"center"});
  toast("已新增「" + row.name + "」：双击行标题改名，点百分比改税率" +
        (kind === "income" ? "，收入合计与销项税已自动带上它" : "，税金合计已自动带上它"));
}
function renRow(id){
  const r = S.rows.find(x=>x.id === id);
  if(!r) return;
  const tip = r.kind === "income" ? "收入项名称（如：劳务收入、其他业务收入）"
            : r.kind === "vatRate" ? "附加税费名称（如：水利建设基金）"
            : "税费名称（如：房产税、土地使用税、车船税）";
  const v = prompt(tip, r.name);
  if(v === null) return;
  const nm = v.trim().slice(0, 20);
  if(!nm){ toast("名称不能为空"); return; }
  r.name = nm;
  buildGrid(); paint(); save();
}
function editRate(id){
  const r = S.rows.find(x=>x.id === id);
  if(!r) return;
  const isIncome = r.kind === "income";
  const v = prompt(isIncome ? "销项税率（%）" : "费率（%，按增值税额计）", r.rate);
  if(v === null) return;
  const x = parseFloat(String(v).replace(/[%\s]/g,""));
  if(!isFinite(x) || x < 0){ toast("请输入有效的非负数字"); return; }
  r.rate = x;
  buildGrid(); syncControls(); paint(); save();
  toast("「" + r.name + "」" + (isIncome ? "销项税率" : "费率") + "已改为 " + x + "%");
}
function delRow(id){
  const r = S.rows.find(x=>x.id === id);
  if(!r) return;
  let filled = 0;
  S.months.forEach(m=>{ if(has(m[id]) || has(m[OV(id)])) filled++; });
  if(filled && !confirm("「" + r.name + "」有 " + filled + " 个月填了数据，删除会一并清掉，确定？")) return;
  S.rows = S.rows.filter(x=>x.id !== id);
  if(Array.isArray(S.order)) S.order = S.order.filter(x=>x !== id);
  S.months.forEach(m=>{ delete m[id]; delete m[OV(id)]; });
  buildGrid(); syncControls(); paint(); save();
  toast("已删除「" + r.name + "」，合计已自动重算");
}

/* ---------- 输入 ---------- */
function onInput(f, i, kind, el){
  const raw = el.value.replace(/,/g,"").replace(/[^\d.\-]/g,"");
  if(raw !== el.value) el.value = raw;
  if(kind === "output" || kind === "vat" || kind === "vatRate" || kind === "preCity" || kind === "carryIn")
    S.months[i][OV(f)] = (raw === "" ? null : raw);
  else S.months[i][f] = raw;
  paint(); save();
}
function onKey(e, f, i){
  if(e.key !== "Enter" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const idx = inputOrder.indexOf(f);
  const next = (e.key === "ArrowUp") ? inputOrder[idx-1] : inputOrder[idx+1];
  if(!next) return;
  const t = inputs[next + "_" + i];
  if(t) t.focus();
}

/* ---------- 渲染 ---------- */
function setVal(el, v){
  if(!el || document.activeElement === el) return;
  if(v === "" || v === null || v === undefined){ el.value = ""; return; }
  el.value = fmt(num(v));
}
function setCalc(td, v, kind, blankMonth){
  if(!td) return;
  td.classList.remove("neg","zero");
  if(blankMonth || v === null || v === undefined){ td.textContent=""; td.title=""; return; }
  if(kind === "pct"){                       // 毛利率：存小数，显示百分比
    td.textContent = (v * 100).toFixed(2) + "%";
    td.title = "毛利率 = 毛利 ÷ 收入合计";
    return;
  }
  td.textContent = fmt(v);
  td.classList.toggle("neg", v < -0.004);
  td.classList.toggle("zero", Math.abs(v) < 0.005);
  td.title = (kind === "vat")
    ? "本月应纳增值税 = 销项税 − 进项税 − 预缴房产增值税 − 期初留抵（不够抵的部分见「期末留抵税额」）"
    : (kind === "carry" && v > 0 ? "本月应纳增值税为 0，这笔留抵结转到下月继续抵扣" : "");
}

/* 某区间（含端点）的累计值 */
function rangeSum(a, b){
  const rows = rowsOf(), o = {}, seen = {};
  const cols = calcSeries();
  rows.forEach(r=>{ o[r.id] = 0; seen[r.id] = false; });
  let any = false, anyCost = false;
  for(let i=a;i<=b;i++){
    const m = S.months[i], c = cols[i];
    if(!isBlank(m)) any = true;
    if(has(m.cost)) anyCost = true;
    rows.forEach(r=>{
      if(isEdit(r)){
        o[r.id] += num(m[r.id]);
        if(has(m[r.id])) seen[r.id] = true;
      }else{
        o[r.id] += (c.vals[r.id] || 0);
      }
    });
  }
  rows.forEach(r=>{ o[r.id] = r2(o[r.id]); });
  /* 留抵是月初/月末时点数，累计相加没有意义，汇总处留空 */
  rows.filter(isCarryRow).forEach(r=>{ o[r.id] = null; });
  /* 毛利/毛利率不是可加量：毛利率用「累计毛利 ÷ 累计收入」，没有成本数据时留空 */
  if(anyCost) o.margin = o.income ? o.gross / o.income : null;
  else { o.gross = null; o.margin = null; }
  return {v:o, seen, any};
}

function paint(){
  /* 先做一轮归一化（顺序走一遍，带上留抵结转，手填值等于自动值就回归自动） */
  let carryN = 0;
  for(let i=0;i<N;i++){
    const m = S.months[i];
    normalizePreCity(m);
    const ci = has(m[OV("carryIn")]) ? r2(num(m[OV("carryIn")])) : (i === 0 ? 0 : carryN);
    normalizeVat(m, ci);
    carryN = calcMonth(m, ci).carryOut;
  }
  const cols = calcSeries();
  const rows = rowsOf();

  view.forEach(v=>{
    if(v.k === "cum"){
      const {v:cv, seen, any} = rangeSum(v.a, v.b);
      rows.forEach(r=>{
        const td = cumCells[r.id];
        if(!td) return;
        const val = cv[r.id];
        const dim = !any || (isEdit(r) && !seen[r.id]) || val === null || val === undefined;
        if(dim){ td.textContent = ""; td.classList.remove("neg"); td.title = ""; return; }
        if(isPctRow(r)){
          td.textContent = (val * 100).toFixed(2) + "%";
          td.classList.toggle("neg", val < 0);
          td.title = (v.a+1) + "–" + (v.b+1) + " 月毛利率";
          return;
        }
        td.textContent = fmt(val);
        td.classList.toggle("neg", val < -0.004);
        td.title = (v.a+1) + "–" + (v.b+1) + " 月累计";
      });
      return;
    }
    const i = v.i, m = S.months[i], c = cols[i];
    const blankMonth = isBlank(m);

    /* 纯输入行（收入项 / 手工税费 / 进项税 / 主营业务成本 / 预缴增值税） */
    rows.filter(r=> isEdit(r)).forEach(r=>{
      setVal(inputs[r.id + "_" + i], m[r.id]);
    });

    /* 双态行（销项税、附加税费、预缴房产城建税、期初留抵）：自动值 + 可手改 + ↺ 还原 */
    rows.filter(isHyb).forEach(r=>{
      const el = inputs[r.id + "_" + i];
      if(!el) return;
      const isCarry = r.kind === "carryIn";
      const man = c.manual[r.id];
      const autoVal = isCarry ? c.carryInAuto : c.auto[r.id];
      const val = man ? m[OV(r.id)] : autoVal;
      /* 期初留抵要显示上月结转过来的数，哪怕本月没有任何数据 */
      if(blankMonth && !man && !(isCarry && num(autoVal))){ 
        if(document.activeElement !== el) el.value = "";
      }else{
        setVal(el, val);
      }
      el.parentElement.classList.toggle("manual", man);
      el.title = isCarry
        ? (man ? "手动值（上月期末留抵 " + fmt(c.carryInAuto) + "），点 ↺ 恢复自动结转"
               : (i === 0 ? "1 月可手填上年结转的留抵，其余月份自动结转上月期末留抵"
                          : "自动结转上月期末留抵 " + fmt(c.carryInAuto) + "，可直接改成手填值"))
        : r.kind === "preCity"
        ? (man ? "手动值（预缴增值税 " + fmt(c.preVat) + " × " + fmt(cityRateInfo().pct) + "% = " + fmt(c.auto.preCity) + "），点 ↺ 恢复自动"
               : "自动计算：预缴房产增值税 " + fmt(c.preVat) + " × " + fmt(cityRateInfo().pct) + "%，可直接改成手填值")
        : r.kind === "vat"
        ? (man ? "手动值（自动算得 " + fmt(c.vatAuto) + "，本月应纳 " + fmt(c.auto.vat) + "），点 ↺ 恢复自动"
               : "自动计算：" + fmt(c.auto.vat) + " ＝ 销项税 − 进项税 − 预缴房产增值税 − 期初留抵，可直接改成手填值（如申报表的应纳税额）")
        : (man ? "手动值（自动值应为 " + fmt(c.auto[r.id]) + "），点 ↺ 恢复自动"
               : "自动计算：" + fmt(c.auto[r.id]) + "，可直接改成手填值");
    });

    /* 只读计算行 */
    rows.filter(r=> !isEdit(r) && !isHyb(r)).forEach(r=>{
      const kind = r.kind === "vat" ? "vat" : (isPctRow(r) ? "pct" : (isCarryRow(r) ? "carry" : null));
      setCalc(calcCells[r.id + "_" + i], c.vals[r.id], kind, blankMonth && !num(c.vals[r.id]));
    });
  });

  const anyCost = S.months.some(m=>has(m.cost));
  const sumIn = r2(cols.reduce((a,c)=>a + (c.income || 0), 0));
  const sumGr = r2(cols.reduce((a,c)=>a + (c.gross || 0), 0));

  const T = {};
  rows.forEach(r=>{
    if(isCarryRow(r)){ T[r.id] = null; return; }
    if(r.kind === "gross"){ T[r.id] = anyCost ? sumGr : null; return; }
    if(r.kind === "margin"){ T[r.id] = (anyCost && sumIn) ? sumGr / sumIn : null; return; }
    T[r.id] = isEdit(r)
      ? r2(S.months.reduce((a,m)=>a + num(m[r.id]), 0))
      : r2(cols.reduce((a,c)=>a + (c.vals[r.id] || 0), 0));
  });
  Object.keys(T).forEach(k=>{
    const td = totalCells[k];
    if(!td) return;
    const rr = rows.find(x=>x.id === k);
    if(T[k] === null || T[k] === undefined){
      td.textContent = ""; td.classList.remove("neg","zero"); td.title = ""; return;
    }
    if(isPctRow(rr)){
      td.textContent = (T[k] * 100).toFixed(2) + "%";
      td.classList.toggle("neg", T[k] < 0);
      td.title = "全年毛利率 = 全年毛利 ÷ 全年收入 = " + fmt(sumGr) + " ÷ " + fmt(sumIn);
      return;
    }
    td.textContent = fmt(T[k]);
    td.classList.toggle("neg", T[k] < -0.004);
  });

  monthHeads.forEach((th,i)=>th.classList.toggle("sel", i === sel));
  paintPanel();
}

/* ---------- 记住上次的文件夹 ----------
   <input type=file> 和 a[download] 都无法指定目录（浏览器不给权限），
   所以走 File System Access API：选择器把上次用的文件 handle 当 startIn 传回去，
   浏览器就会定位到同一个文件夹。handle 存在 IndexedDB 里（可跨会话）。
   不支持的浏览器（Safari / Firefox / file:// 打开）自动退回原来的 input + 下载。 */
const FSA_OK = typeof window !== "undefined" &&
               typeof window.showOpenFilePicker === "function" &&
               typeof window.showSaveFilePicker === "function" &&
               location.protocol !== "file:" &&      // 双击本地 html 打开时选择器会抛 SecurityError，直接用老办法
               window.isSecureContext !== false;
const FS_DB = "tax-ledger-fs", FS_STORE = "handles";
const FS_MEM = { lastFile:null, lastSave:null };     // 页面载入时预热，点按钮时不用再等 IDB
function fsDb(){
  return new Promise((res, rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("no idb"));
    const r = indexedDB.open(FS_DB, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(FS_STORE)) r.result.createObjectStore(FS_STORE); };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
/* IDB 只在 https 下稳定；file:// 或隐私模式下可能一直不回调，所以都加超时兜底 */
const raceTimeout = (p, ms) => Promise.race([p, new Promise(r=>setTimeout(()=>r(null), ms))]);
async function fsGet(key){
  try{
    return await raceTimeout((async ()=>{
      const db = await fsDb();
      return await new Promise(res=>{
        const q = db.transaction(FS_STORE, "readonly").objectStore(FS_STORE).get(key);
        q.onsuccess = ()=> res(q.result || null);
        q.onerror = ()=> res(null);
      });
    })(), 1200);
  }catch(e){ return null; }
}
/* 记忆先落在内存里（当次会话立刻生效），IDB 写盘不阻塞调用方 */
function fsSet(key, h){
  FS_MEM[key] = h;
  raceTimeout((async ()=>{
    const db = await fsDb();
    return new Promise(res=>{
      const tx = db.transaction(FS_STORE, "readwrite");
      tx.objectStore(FS_STORE).put(h, key);
      tx.oncomplete = ()=> res(1);
      tx.onerror = ()=> res(null);
    });
  })(), 1500).catch(()=>{});
}
if(FSA_OK) (async ()=>{
  /* 只补空的：用户可能在本轮已经选过文件，别让慢半拍的 IDB 把它覆盖成 null */
  const f = await fsGet("lastFile");
  if(f && !FS_MEM.lastFile) FS_MEM.lastFile = f;
  const v = await fsGet("lastSave");
  if(v && !FS_MEM.lastSave) FS_MEM.lastSave = v;
})();
/* 选择要读的文件：返回 File（选中）、null（用户取消）、undefined（不支持，调用方退回 input） */
async function pickFile(kind){
  if(!FSA_OK) return undefined;
  const types = kind === "json"
    ? [{description:"存档 JSON", accept:{"application/json":[".json"]}}]
    : [{description:"Excel / CSV", accept:{
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx",".xlsm"],
        "application/vnd.ms-excel":[".xls"],
        "text/csv":[".csv"],
        "text/html":[".htm",".html"]}}];
  const startIn = FS_MEM.lastFile || FS_MEM.lastSave || null;
  const tries = startIn ? [startIn, null] : [null];   // startIn 失效就重开一次不带的
  for(const si of tries){
    try{
      const opts = { multiple:false, excludeAcceptAllOption:false, types };
      if(si) opts.startIn = si;
      const picked = await window.showOpenFilePicker(opts);
      const h = picked && picked[0];
      if(!h) return null;
      fsSet("lastFile", h);
      return await h.getFile();
    }catch(e){
      if(e && e.name === "AbortError") return null;     // 用户按了取消
    }
  }
  return undefined;
}
/* 保存文件：返回实际文件名（保存成功/回退下载）或 null（用户取消） */
async function saveFile(blob, name, key){
  if(!FSA_OK){ download(blob, name); return name; }
  const startIn = FS_MEM[key] || FS_MEM.lastSave || FS_MEM.lastFile || null;
  const tries = startIn ? [startIn, null] : [null];
  let h = null;
  for(const si of tries){
    try{
      const opts = { suggestedName:name };
      if(si) opts.startIn = si;
      h = await window.showSaveFilePicker(opts);
      break;
    }catch(e){
      if(e && e.name === "AbortError") return null;     // 用户按了取消
    }
  }
  if(!h){ download(blob, name); return name; }          // 选择器不可用 → 退回浏览器下载
  try{
    fsSet(key, h);
    const w = await h.createWritable();
    await w.write(blob);
    await w.close();
    return h.name;
  }catch(e){
    download(blob, name);
    return name;
  }
}

/* ================= 真 xlsx 导出（自写 ZIP + OOXML） ================= */
const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }

function zipStore(entries){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dTime = ((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFFFF;
  const dDate = (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF;
  entries.forEach(e=>{
    const name = enc.encode(e.name), data = e.data, crc = crc32(data);
    const lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dTime,true); lv.setUint16(12,dDate,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lh.set(name,30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,dTime,true); cv.setUint16(14,dDate,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  return new Blob([...parts, ...central, eocd],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colName = n => { let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };

const STY = {head:1, num:2, pct:3, text:4, title:5, sec:6, red:7, totL:8, totN:9, totP:10};
function sheetXml(rows, merges, freeze, widths){
  const cols = (widths && widths.length)
    ? '<cols>' + widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('') + '</cols>'
    : '<cols><col min="1" max="1" width="26" customWidth="1"/>' +
      '<col min="2" max="13" width="13.5" customWidth="1"/>' +
      '<col min="14" max="14" width="15" customWidth="1"/></cols>';
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0">' +
    (freeze ? '<pane xSplit="1" ySplit="2" topLeftCell="B3" activePane="bottomRight" state="frozen"/>' : '') +
    '</sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="18"/>' +
    cols +
    '<sheetData>';
  rows.forEach((row, ri)=>{
    const r = ri + 1;
    const cells = row.cells || row;
    const ht = row.ht ? ' ht="' + row.ht + '" customHeight="1"' : '';
    x += '<row r="'+r+'"'+ht+'>';
    cells.forEach((c, ci)=>{
      if(c === null || c === undefined) return;
      const ref = colName(ci+1) + r;
      const st = c.s ? ' s="'+c.s+'"' : '';
      if(c.empty){ x += '<c r="'+ref+'"'+st+'/>'; return; }
      if(c.t === "s"){
        x += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+esc(c.v)+'</t></is></c>';
      }else{
        x += '<c r="'+ref+'"'+st+'><v>'+c.v+'</v></c>';
      }
    });
    x += '</row>';
  });
  x += '</sheetData>';
  if(merges && merges.length){
    x += '<mergeCells count="'+merges.length+'">' +
         merges.map(m=>'<mergeCell ref="'+m+'"/>').join('') + '</mergeCells>';
  }
  return x + '</worksheet>';
}

async function exportExcel(){
  const W = 1 + N + 1;
  const lastCol = colName(W);
  const merges = [];
  const rows = [];
  /* 公司名称：控制栏里填的那个，留空就只写「年度税金台账」 */
  const co = String(S.company || "").trim();

  /* 逐月数据 + 累计 */
  const months = [];
  const incRows = rowsOf().filter(r=>r.kind === "income");
  const rateRows = rowsOf().filter(r=>r.kind === "vatRate");
  const feeRows = rowsOf().filter(r=>r.kind === "input");
  let pI=0, pO=0, pN=0, pV=0, pT=0, pX=0, pC=0, pG=0, pPv=0, pPc=0;
  const pInc = {}, pRate = {};
  incRows.forEach(r=>{ pInc[r.id] = 0; });
  rateRows.forEach(r=>{ pRate[r.id] = 0; });
  const series = calcSeries();
  for(let i=0;i<N;i++){
    const m = S.months[i], c = series[i];
    incRows.forEach(r=>{ pInc[r.id] += num(m[r.id]); });
    rateRows.forEach(r=>{ pRate[r.id] += (c.vals[r.id] || 0); });
    pI += c.income; pO += c.output; pN += num(m.inputTax); pV += c.base; pT += c.total; pX += c.other;
    pC += c.cost; pG += (c.gross || 0); pPv += c.preVat; pPc += c.preCity;
    months.push({i, m, c, blank:isBlank(m), pI, pO, pN, pV, pT, pX, pC, pG, pPv, pPc,
                 pInc:Object.assign({}, pInc), pRate:Object.assign({}, pRate)});
  }
  const last = months[N-1];

  const numCell = (v, s) => (v === null || v === undefined) ? {empty:true, s} : {t:"n", v:r2(v), s};
  const pctCell = (v, s) => (v === null || v === undefined) ? {empty:true, s} : {t:"n", v, s};

  /* 标题条（深蓝底金字，整行合并） */
  rows.push({ht:30, cells:[{t:"s", v:(co ? co + " · " : "") + S.year + " 年度税金台账", s:STY.title}]});
  merges.push("A1:" + lastCol + "1");

  /* 表头 */
  const head = [{t:"s", v:"项目", s:STY.head}];
  for(let i=0;i<N;i++) head.push({t:"s", v:(i+1)+"月", s:STY.head});
  head.push({t:"s", v:"合计", s:STY.head});
  rows.push({ht:22, cells:head});

  const section = txt => {
    rows.push({ht:21, cells:[{t:"s", v:txt, s:STY.sec}]});
    merges.push("A" + rows.length + ":" + lastCol + rows.length);
  };

  /* 一行数据：项目名 + 12 个月 + 合计（金额/百分比自动判断） */
  const addRow = (r, opts) => {
    opts = opts || {};
    const lstyle = opts.tot ? STY.totL : (opts.red ? STY.red : STY.text);
    const ns = opts.tot ? STY.totN : STY.num;
    const ps = opts.tot ? STY.totP : STY.pct;
    const asPct = isPctRow(r);
    const noSum = isCarryRow(r);          // 留抵是时点数，合计列留空
    const cells = [{t:"s", v:opts.name || r.name, s:lstyle}];
    let sum = 0, any = false, sumG = 0, sumI = 0;
    months.forEach(a=>{
      const m = a.m, c = a.c;
      if(asPct){
        const v = (a.blank || !c.costFilled) ? null : c.margin;
        cells.push(pctCell(v, ps));
        if(!a.blank && c.costFilled){ sumG += c.gross; sumI += c.income; any = true; }
        return;
      }
      let v = null;
      if(noSum){
        /* 留抵要按结转链逐月给值，空月份也照填（上月留抵会顺延下来） */
        v = c.vals[r.id];
        if(!v) v = null;
      }else if(!a.blank){
        v = isEdit(r) ? (has(m[r.id]) ? num(m[r.id]) : null) : c.vals[r.id];
      }
      cells.push(numCell(v, ns));
      if(v !== null && v !== undefined){ sum += v; any = true; }
    });
    cells.push(asPct ? pctCell(any && sumI ? sumG / sumI : null, ps)
                     : numCell(noSum ? null : (any ? sum : null), ns));
    rows.push({cells});
  };

  section("一、基础经营数据");
  incRows.forEach(r=>addRow(r));
  addRow(FIXED.income, {red:true});
  addRow(FIXED.cost);
  addRow(FIXED.gross, {red:true});
  addRow(FIXED.margin, {red:true});

  section("二、增值税计算明细");
  addRow(FIXED.output);
  addRow(FIXED.inputTax);
  addRow(FIXED.preVat);
  addRow(FIXED.carryIn);
  addRow(FIXED.vat, {red:true});
  addRow(FIXED.carryOut);

  section("三、附加税及其他税种明细");
  let cityRowSeen = false;
  rateRows.forEach(r=>{
    addRow(r);
    if(isCityRow(r)){ addRow(FIXED.preCity); cityRowSeen = true; }
  });
  feeRows.forEach(r=>{
    addRow(r);
    /* 城建税是手工税费行时，预缴行紧跟其后 */
    if(!cityRowSeen && isCityRow(r)){ addRow(FIXED.preCity); cityRowSeen = true; }
  });
  if(!cityRowSeen) addRow(FIXED.preCity);
  addRow(FIXED.total, {tot:true});

  section("四、税负分析");
  [
    ["本月增值税税负率", a=> a.c.income ? a.c.base / a.c.income : null, ()=>null],
    ["本年增值税税负率", a=> a.pI ? a.pV / a.pI : null,              a=> a.pI ? a.pV / a.pI : null],
    ["本月综合税负率",   a=> a.c.income ? a.c.total / a.c.income : null, ()=>null],
    ["本年综合税负率",   a=> a.pI ? a.pT / a.pI : null,              a=> a.pI ? a.pT / a.pI : null]
  ].forEach(pair=>{
    const cells = [{t:"s", v:pair[0], s:STY.red}];
    months.forEach(a=>{ cells.push(pctCell(a.blank ? null : pair[1](a), STY.pct)); });
    cells.push(pctCell(pair[2](last), STY.pct));
    rows.push({cells});
  });

  /* 工作表2：税负率与利润分析（月份为列） */
  const rows2 = [];
  rows2.push({ht:28, cells:[{t:"s", v:(co ? co + " · " : "") + "税负率与利润分析 · " + S.year + " 年度", s:STY.title}]});
  const H2 = [{t:"s", v:"项目", s:STY.head}];
  for(let i=0;i<N;i++) H2.push({t:"s", v:(i+1)+"月", s:STY.head});
  H2.push({t:"s", v:"全年累计", s:STY.head});
  rows2.push({ht:22, cells:H2});
  const merges2 = ["A1:" + lastCol + "1"];

  const pushRow = (label, monthFn, totalFn, isPct, red) => {
    const line = [{t:"s", v:label, s:red ? STY.red : STY.text}];
    months.forEach(a=>{
      const v = a.blank ? null : monthFn(a);
      line.push(isPct ? pctCell(v, STY.pct) : numCell(v, STY.num));
    });
    const t = totalFn(last);
    line.push(isPct ? pctCell(t, STY.pct) : numCell(t, STY.num));
    rows2.push({cells:line});
  };

  incRows.forEach(r=>{
    pushRow(r.name, a=> has(a.m[r.id]) ? num(a.m[r.id]) : null, a=>a.pInc[r.id]);
  });
  pushRow("收入合计",     a=>a.c.income, a=>a.pI, 0, 1);
  pushRow("主营业务成本", a=> a.c.costFilled ? a.c.cost : null, a=> a.pC ? a.pC : null);
  pushRow("毛利",         a=> a.c.gross, a=> a.pC ? a.pG : null, 0, 1);
  pushRow("毛利率",       a=> a.c.margin, a=> a.pI && a.pC ? a.pG / a.pI : null, 1, 1);
  pushRow("销项税",       a=>a.c.output, a=>a.pO);
  pushRow("进项税",       a=> has(a.m.inputTax) ? num(a.m.inputTax) : null, a=>a.pN);
  pushRow("预缴房产增值税", a=> has(a.m.preVat) ? num(a.m.preVat) : null, a=>a.pPv);
  pushRow("期初留抵税额",  a=> a.c.carryIn || null, ()=>null);
  pushRow("增值税(应纳)", a=>a.c.base,  a=>a.pV, 0, 1);
  pushRow("期末留抵税额",  a=> a.c.carryOut || null, a=> a.c.carryOut);
  let cityDone = false;
  rateRows.forEach(r=>{
    pushRow(r.name, a=>a.c.vals[r.id], a=>a.pRate[r.id]);
    if(isCityRow(r)){
      pushRow("预缴房产城建税", a=> a.c.preCity ? a.c.preCity : null, a=>a.pPc);
      cityDone = true;
    }
  });
  if(!cityDone) pushRow("预缴房产城建税", a=> a.c.preCity ? a.c.preCity : null, a=>a.pPc);
  if(feeRows.length) pushRow("其他税费", a=>a.c.other, a=>a.pX);
  pushRow("全部税金",     a=>a.c.total, a=>a.pT, 0, 1);
  pushRow("本月增值税税负率", a=> a.c.income ? a.c.base  / a.c.income : null, ()=>null, 1, 1);
  pushRow("本年增值税税负率", a=> a.pI ? a.pV / a.pI : null, a=> a.pI ? a.pV / a.pI : null, 1, 1);
  pushRow("本月综合税负率",   a=> a.c.income ? a.c.total / a.c.income : null, ()=>null, 1, 1);
  pushRow("本年综合税负率",   a=> a.pI ? a.pT / a.pI : null, a=> a.pI ? a.pT / a.pI : null, 1, 1);

  const enc = new TextEncoder();
  const files = [
    {name:"[Content_Types].xml", data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>')},
    {name:"_rels/.rels", data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>')},
    {name:"xl/workbook.xml", data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      '<sheet name="明细台账" sheetId="1" r:id="rId1"/><sheet name="税负率" sheetId="2" r:id="rId2"/>' +
      '</sheets></workbook>')},
    {name:"xl/_rels/workbook.xml.rels", data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>')},
    {name:"xl/styles.xml", data:enc.encode(STYLES_XML)},
    {name:"xl/worksheets/sheet1.xml", data:enc.encode(sheetXml(rows, merges, 1))},
    {name:"xl/worksheets/sheet2.xml", data:enc.encode(sheetXml(rows2, merges2, 1))}
  ];
  const fname = (co ? co + "_" : "") + "税金台账_" + S.year + ".xlsx";
  const saved = await saveFile(zipStore(files), fname, "lastSave");
  if(saved) toast("已保存 " + saved + "（含明细台账 + 税负率两个工作表）");
}

/* ================= 映射表：导出 / 导入 =================
   导出的列和「导入映射」认的列完全一致（台账项目 / 适用公司 / 余额表科目编码 / 科目名称 /
   取数口径 / 条件），所以 导出 → 改 → 导回来 就是一条维护闭环。
   导出的永远是「当前生效」那份：导过映射表就是那份，没导过就是内置 DEF_MAP。 */
function mapMatrix(){
  const head = ["台账项目","适用公司","余额表科目编码","科目名称","取数口径","条件"];
  const mat = [head.map(v=>({t:"s", v:v, s:STY.head}))];
  mapRows().forEach(x=>{
    mat.push([
      {t:"s", v:String(x.item == null ? "" : x.item), s:STY.text},
      {t:"s", v:String(x.co   == null ? "" : x.co),   s:STY.text},
      {t:"s", v:String(x.code == null ? "" : x.code), s:STY.text},
      {t:"s", v:String(x.name == null ? "" : x.name), s:STY.text},
      {t:"s", v:String(x.col  == null ? "" : x.col),  s:STY.text},
      {t:"s", v:x.only === "fallback" ? "兜底" : "",  s:STY.text}
    ]);
  });
  return mat;
}

/* ================= 导入（xlsx / xls-html / csv） ================= */
async function inflateRaw(u8){
  if(typeof DecompressionStream === "undefined") throw new Error("当前浏览器不支持解压 xlsx，请用 Edge/Chrome 打开");
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buffer){
  const u8 = new Uint8Array(buffer), dv = new DataView(buffer);
  let eocd = -1;
  for(let i=u8.length-22; i>=Math.max(0,u8.length-66000); i--){
    if(dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("不是有效的 xlsx 文件");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const out = {};
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) break;
    const method = dv.getUint16(p+10,true);
    const csize = dv.getUint32(p+20,true);
    const nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true);
    const lho = dv.getUint32(p+42,true);
    const name = new TextDecoder().decode(u8.subarray(p+46, p+46+nlen));
    const lnlen = dv.getUint16(lho+26,true), lelen = dv.getUint16(lho+28,true);
    const start = lho + 30 + lnlen + lelen;
    const raw = u8.subarray(start, start + csize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    p += 46 + nlen + elen + clen;
  }
  return out;
}
function parseShared(xml){
  const out = [];
  const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
  let m;
  while((m = re.exec(xml))){
    let txt = "";
    const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
    let t;
    while((t = tRe.exec(m[1]))) txt += t[1];
    out.push(unesc(txt));
  }
  return out;
}
/* XML 文本还原：命名实体 + 数字字符引用都要解 —— openpyxl 等工具会把中文写成 &#21488; / &#x53F0;，
   只解 &amp; 这类命名实体的话，读进来就是一串「&#21488;&#36134;」乱码 */
const unesc = s => String(s)
  .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
  .replace(/&apos;/g,"'").replace(/&#39;/g,"'").replace(/&nbsp;/g," ")
  .replace(/&amp;/g,"&")
  .replace(/&#(\d+);/g, (m,d)=>{ const n = +d; return n > 0 && n <= 0x10FFFF ? String.fromCodePoint(n) : m; })
  .replace(/&#x([0-9a-fA-F]+);/g, (m,h)=>{ const n = parseInt(h,16); return n > 0 && n <= 0x10FFFF ? String.fromCodePoint(n) : m; });

function sheetToMatrix(xml, shared){
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while((rm = rowRe.exec(xml))){
    const line = [];
    const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cm;
    while((cm = cRe.exec(rm[1]))){
      const attrs = cm[1] || "", inner = cm[2] || "";
      const ref = (attrs.match(/r="([A-Z]+)\d+"/) || [])[1] || "A";
      let idx = 0;
      for(let i=0;i<ref.length;i++) idx = idx*26 + (ref.charCodeAt(i)-64);
      idx -= 1;
      let val = "";
      const inline = inner.match(/<is>[\s\S]*?<t\b[^>]*>([\s\S]*?)<\/t>/);
      const vTag = inner.match(/<v>([\s\S]*?)<\/v>/);
      if(inline) val = unesc(inline[1]);
      else if(vTag){
        val = unesc(vTag[1]);
        if(/t="s"/.test(attrs) && shared) val = shared[parseInt(val,10)] || "";
      }
      while(line.length < idx) line.push("");
      line[idx] = val;
    }
    rows.push(line);
  }
  return rows;
}
function htmlTableToMatrix(htmlText){
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const tbl = doc.querySelector("table");
  if(!tbl) return [];

  "预缴房产城建税":"preCity", "房产城建税":"preCity", "预缴城建税":"preCity", "异地预缴城建税":"preCity",
